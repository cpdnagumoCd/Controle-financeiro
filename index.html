/* ---------------------------------------------------------------- formulário de lançamento (novo e edição) */

let seqForm = 0;
/**
 * Monta o formulário em `host`.
 * opts: { item (edição), aoSalvar(lancamento, editado), aoCancelar(), aoMudarData(iso) }
 */
function criarFormLancamento(host, opts = {}) {
  const item = opts.item || null;
  const st = {
    tipo: item ? item.tipo : S.ultimoTipo,
    formas: new Set(item ? FORMAS.filter((f) => item[f.k] > 0).map((f) => f.k) : S.ultimasFormas),
  };
  if (!st.formas.size) st.formas.add("debito");
  const dl = `dl-forn-${++seqForm}`;

  host.innerHTML = `
    <form class="flanc" novalidate autocomplete="off">
      ${item ? `<div class="aviso-edicao">${ic("i-edit")}<span>Lançado por <b>${esc(item.criado_por || "—")}</b>${item.criado_em ? ` em ${esc(fmtDataHora(item.criado_em))}` : ""}${item.alterado_por ? ` · alterado por <b>${esc(item.alterado_por)}</b> em ${esc(fmtDataHora(item.alterado_em))}` : ""}</span></div>` : ""}
      <div class="grade">
        <div class="field c2"><label>Data do pagamento <span class="req">*</span></label><input class="input" type="date" name="data" required></div>
        <div class="field c2"><label>NFS-e / RPS <span class="req">*</span></label><input class="input" name="nf" placeholder="Nº do título" required></div>
        <div class="field c2"><label>Carga</label><input class="input" name="carga" placeholder="Nº da carga"></div>
        <div class="field c6"><label>Fornecedor / Transportador <span class="req">*</span></label>
          <input class="input" name="fornecedor" list="${dl}" placeholder="Razão social em que a nota foi emitida" required></div>
        <div class="field c3"><span class="rotulo">Tipo da carga <span class="req">*</span></span>
          <div class="seg" data-tipo role="group" aria-label="Tipo da carga">
            <button type="button" data-t="agendada">${ic("i-calendar")}Agendada</button>
            <button type="button" data-t="sem_agenda" class="red">${ic("i-truck")}Sem agenda</button>
          </div>
        </div>
        <div class="field c3"><span class="rotulo">Quitado</span>
          <label class="switch"><input type="checkbox" name="quitado"><span class="trilho"></span><span data-quit-txt>Não</span></label>
        </div>
        <div class="field c6"><span class="rotulo">Forma de pagamento <span class="req">*</span> <span class="dica-inline">· marque mais de uma se o pagamento foi dividido</span></span>
          <div class="chips" role="group" aria-label="Formas de pagamento">
            ${FORMAS.map((f) => `<button type="button" class="chip" data-forma="${f.k}" aria-pressed="false">${ic(f.ic)}${f.nome}</button>`).join("")}
          </div>
        </div>
        <div class="c6 valores"></div>
        <div class="field c6"><label>Observação</label><input class="input" name="obs" placeholder="Opcional"></div>
      </div>
      <div class="flanc-rodape">
        <div class="total-form"><small>Total do lançamento</small><b data-total>R$ 0,00</b></div>
        <span class="esp"></span>
        <button type="button" class="btn btn-ghost" data-cancelar>${item ? "Cancelar" : "Limpar"}</button>
        <button type="submit" class="btn btn-red btn-lg">${ic("i-check")}${item ? "Salvar alterações" : "Salvar lançamento"}</button>
      </div>
    </form>
    <datalist id="${dl}" data-forn>${S.fornecedores.map((n) => `<option value="${esc(n)}">`).join("")}</datalist>`;

  const f = $("form", host);
  const valores = $(".valores", f);

  const pintarTipo = () => $$("[data-t]", f).forEach((b) => { b.classList.toggle("on", b.dataset.t === st.tipo); b.setAttribute("aria-pressed", b.dataset.t === st.tipo); });
  const lerValores = () => {
    const v = zeros();
    let ok = true;
    for (const fm of FORMAS) {
      if (!st.formas.has(fm.k)) continue;
      const inp = $(`[name=v_${fm.k}]`, valores);
      const c = parseBRL(inp.value);
      if (c === null) { ok = false; inp.classList.add("invalido"); } else v[fm.k] = c;
    }
    return { v, ok };
  };
  const atualizarTotal = () => ($("[data-total]", f).textContent = fmtBRL(somaObj(lerValores().v)));
  const pintarFormas = () => {
    const antes = {};
    $$("input", valores).forEach((i) => (antes[i.name] = i.value));
    $$("[data-forma]", f).forEach((c) => { const on = st.formas.has(c.dataset.forma); c.classList.toggle("on", on); c.setAttribute("aria-pressed", on); });
    valores.innerHTML = FORMAS.filter((fm) => st.formas.has(fm.k)).map((fm) => `
      <div class="field"><label>${ic(fm.ic)}Valor · ${fm.nome} <span class="req">*</span></label>
        <div class="dinheiro"><span>R$</span><input class="input" name="v_${fm.k}" inputmode="decimal" placeholder="0,00" value="${esc(antes["v_" + fm.k] || "")}"></div>
      </div>`).join("");
    $$("input", valores).forEach((i) => {
      i.oninput = () => { i.classList.remove("invalido"); atualizarTotal(); };
      i.onblur = () => { const c = parseBRL(i.value); if (c) i.value = fmtNum(c); };
    });
    atualizarTotal();
  };
  const preencher = (l) => {
    f.data.value = l.data;
    f.fornecedor.value = l.fornecedor;
    f.nf.value = l.nf;
    f.carga.value = l.carga || "";
    f.obs.value = l.obs || "";
    f.quitado.checked = !!l.quitado;
    $("[data-quit-txt]", f).textContent = l.quitado ? "Sim" : "Não";
    pintarFormas();
    FORMAS.forEach((fm) => { const i = $(`[name=v_${fm.k}]`, valores); if (i) i.value = l[fm.k] ? fmtNum(l[fm.k]) : ""; });
    atualizarTotal();
  };
  const limpar = (manterData) => {
    const data = f.data.value;
    f.reset();
    f.data.value = manterData && data ? data : opts.dataInicial || hojeISO();
    st.tipo = S.ultimoTipo;
    st.formas = new Set(S.ultimasFormas);
    valores.innerHTML = "";
    $("[data-quit-txt]", f).textContent = "Não";
    $$(".invalido", f).forEach((i) => i.classList.remove("invalido"));
    pintarTipo();
    pintarFormas();
  };

  $$("[data-t]", f).forEach((b) => (b.onclick = () => { st.tipo = b.dataset.t; pintarTipo(); }));
  $$("[data-forma]", f).forEach((c) => (c.onclick = () => {
    const k = c.dataset.forma;
    if (st.formas.has(k) && st.formas.size > 1) st.formas.delete(k); else st.formas.add(k);
    pintarFormas();
    $(`[name=v_${k}]`, valores)?.focus();
  }));
  f.quitado.onchange = () => ($("[data-quit-txt]", f).textContent = f.quitado.checked ? "Sim" : "Não");
  f.data.onchange = () => { f.data.classList.remove("invalido"); if (f.data.value) opts.aoMudarData?.(f.data.value); };
  ["nf", "fornecedor"].forEach((n) => f[n].addEventListener("input", () => f[n].classList.remove("invalido")));
  $("[data-cancelar]", f).onclick = () => (item ? opts.aoCancelar?.() : (limpar(true), f.nf.focus()));

  async function salvar(forcar = false) {
    $$(".invalido", f).forEach((i) => i.classList.remove("invalido"));
    const faltando = ["data", "nf", "fornecedor"].filter((n) => !f[n].value.trim());
    faltando.forEach((n) => f[n].classList.add("invalido"));
    if (faltando.length) { f[faltando[0]].focus(); return toast("Preencha os campos obrigatórios destacados.", "erro"); }
    const { v, ok } = lerValores();
    if (!ok) return toast("Há um valor inválido. Use o formato 1.234,56.", "erro");
    const total = somaObj(v);
    if (total <= 0) {
      $$("input", valores).forEach((i) => i.classList.add("invalido"));
      $("input", valores)?.focus();
      return toast("Informe o valor pago.", "erro");
    }
    if (!forcar && f.data.value > hojeISO()) {
      const sim = await confirmar("Data no futuro", `A data do pagamento é <b>${fmtData(f.data.value)}</b>, depois de hoje. Está correta?`, "Sim, está correta");
      if (!sim) return f.data.focus();
    }
    const corpo = {
      empresa: S.empresa, data: f.data.value, fornecedor: f.fornecedor.value, nf: f.nf.value, carga: f.carga.value,
      tipo: st.tipo, quitado: f.quitado.checked, obs: f.obs.value, ...v, forcar,
    };
    const btn = $("[type=submit]", f);
    btn.disabled = true;
    try {
      const l = item ? await api("PUT", `/api/lancamentos/${item.id}`, corpo) : await api("POST", "/api/lancamentos", corpo);
      S.ultimoTipo = st.tipo;
      S.ultimasFormas = [...st.formas];
      if (item) toast("Lançamento atualizado.");
      else {
        toast(`NFS-e/RPS ${l.nf} lançada · ${fmtBRL(total)}`);
        limpar(true);
        f.nf.focus();
      }
      carregarFornecedores();
      opts.aoSalvar?.(l, !!item);
    } catch (x) {
      if (x.status === 409 && x.dados?.duplicado) {
        btn.disabled = false;
        if (await confirmar("Possível lançamento duplicado", `${esc(x.message)}<br><br>Deseja salvar mesmo assim?`, "Salvar mesmo assim")) return salvar(true);
      } else toast(x.message, "erro");
    } finally {
      btn.disabled = false;
    }
  }
  f.onsubmit = (e) => { e.preventDefault(); salvar(); };

  pintarTipo();
  if (item) preencher(item); else { limpar(false); }
  return { form: f, focar: () => (item ? f.fornecedor : f.nf).focus(), limpar };
}

function abrirEdicao(l, aoSalvar) {
  painelLateral(`Editar lançamento · NFS-e ${l.nf}`, (host, fechar) => {
    host.innerHTML = `<section class="card"><div class="card-b"></div></section>`;
    criarFormLancamento($(".card-b", host), {
      item: l,
      aoSalvar: () => { fechar(); aoSalvar?.(); },
      aoCancelar: fechar,

async function excluirLancamento(l, depois) {

async function alternarQuitado(l, depois) {

}

const seloTipo = (t) => (t === "agendada" ? `<span class="selo s-navy">Agendada</span>` : `<span class="selo s-red">Sem agenda</span>`);
const formasDe = (l) => FORMAS.filter((f) => l[f.k] > 0).map((f) => f.nome).join(" + ");

const seqDia = sequenciador();

function paginaNovo() {
  cabecalho(`Novo lançamento <span class="selo s-red">${esc(rotuloEmpresa(S.empresa))}</span>`,
    "Registre cada pagamento recebido. O painel ao lado mostra o que já foi lançado no dia.",
    `<a class="btn btn-outline" href="#/consulta">${ic("i-list")}Consultar lançamentos</a>`);
  $("#main").innerHTML = `
    <div class="novo-grid">

        <div class="card-h"><h2><span class="barra"></span>Dados do pagamento</h2><span class="esp"></span><span class="dica">Campos com <b class="req">*</b> são obrigatórios · <b>Enter</b> salva</span></div>
        <div class="card-b" id="form-novo"></div>
      </section>
      <aside class="card painel-dia" id="painel-dia" aria-live="polite"></aside>

  carregarDia();

async function carregarDia() {
  const painel = $("#painel-dia");
  if (!painel) return;
  const dia = diaDoPainel || hojeISO();
  const atual = seqDia();
  painel.classList.add("carregando");
  try {
    const r = await api("GET", `/api/lancamentos?${new URLSearchParams({ empresa: S.empresa, de: dia, ate: dia, tamanho: 500 })}`);
    if (!atual() || !$("#painel-dia")) return;
    const titulo = dia === hojeISO() ? "Lançados hoje" : `Lançados em ${fmtData(dia)}`;
    painel.innerHTML = `
      <div class="card-h"><h2><span class="barra"></span>${titulo}</h2><span class="esp"></span>
        <span class="selo s-gray">${r.quantidade} ${r.quantidade === 1 ? "lançamento" : "lançamentos"}</span></div>
      <div class="dia-totais">
        ${FORMAS.map((f) => `<div><small>${f.nome}</small><b class="${r.soma[f.k] ? "" : "vazio"}">${fmtBRL(r.soma[f.k])}</b></div>`).join("")}
        <div class="tot"><small>Total do dia · ${diaSemana(dia)}</small><b>${fmtBRL(r.soma.total)}</b></div>
      </div>
      ${r.itens.length ? `<ul class="dia-lista">
        ${r.itens.map((l) => `
          <li data-id="${esc(l.id)}" title="Clique para editar">
            <div class="info"><b>${esc(l.fornecedor)}</b>

          </li>`).join("")}

/* ---------------------------------------------------------------- página: consulta */

const seqLista = sequenciador();

function periodoRapido(q) {
  const h = new Date();
  if (q === "hoje") return [hojeISO(), hojeISO()];
  if (q === "7d") return [isoLocal(new Date(h.getFullYear(), h.getMonth(), h.getDate() - 6)), hojeISO()];
  if (q === "mes") return [isoLocal(new Date(h.getFullYear(), h.getMonth(), 1)), isoLocal(new Date(h.getFullYear(), h.getMonth() + 1, 0))];
  if (q === "mesant") return [isoLocal(new Date(h.getFullYear(), h.getMonth() - 1, 1)), isoLocal(new Date(h.getFullYear(), h.getMonth(), 0))];
  return ["", ""];
}

function paginaConsulta() {
  cabecalho(`Consultar lançamentos <span class="selo s-red">${esc(rotuloEmpresa(S.empresa))}</span>`,
    "Filtre por período, fornecedor, NFS-e, carga, forma de pagamento ou tipo. Clique numa linha para editar.",
    `<button class="btn btn-outline" data-exportar>${ic("i-download")}Exportar para Excel</button>
     <a class="btn btn-red" href="#/novo">${ic("i-plus")}Novo lançamento</a>`);
  $("#main").innerHTML = `
    <section class="card nao-imprimir"><div class="card-b">
      <form class="filtros" autocomplete="off" onsubmit="return false">
        <div class="linha">
          <div class="field periodo-campo"><label>Período (data do pagamento)</label>
            <div class="periodo"><input class="input" type="date" name="de" aria-label="De"><input class="input" type="date" name="ate" aria-label="Até"></div></div>
          <div class="field"><span class="rotulo">Atalhos</span>
            <div class="rapidos">
              <button type="button" data-q="hoje">Hoje</button><button type="button" data-q="7d">Últimos 7 dias</button>
              <button type="button" data-q="mes">Este mês</button><button type="button" data-q="mesant">Mês anterior</button><button type="button" data-q="tudo">Tudo</button>
            </div></div>
        </div>
        <div class="linha2">
          <div class="field busca"><label>Buscar</label>
            <div class="input-icone">${ic("i-search")}<input class="input" name="q" type="search" placeholder="Fornecedor, NFS-e / RPS ou carga"></div></div>
          <div class="field"><label>Forma de pagamento</label>
            <select class="input" name="forma"><option value="">Todas</option>${FORMAS.map((f) => `<option value="${f.k}">${f.nome}</option>`).join("")}</select></div>
          <div class="field"><label>Tipo da carga</label>
            <select class="input" name="tipo"><option value="">Todos</option><option value="agendada">Agendada</option><option value="sem_agenda">Sem agenda</option></select></div>
          <div class="field"><label>Quitado</label>
            <select class="input" name="quitado"><option value="">Todos</option><option value="1">Sim</option><option value="0">Não</option></select></div>
          <div class="botoes"><button type="button" class="btn btn-ghost" data-limpar>${ic("i-x")}Limpar filtros</button></div>
        </div>
      </form>
    </div></section>
    <section class="card">
      <div class="kpis" id="kpis"></div>
      <div id="lista"></div>
    </section>`;

  const f = $("form.filtros");
  if (S.filtro === null) { const [de, ate] = periodoRapido("mes"); S.filtro = { de, ate }; }
  for (const [k, v] of Object.entries(S.filtro)) if (f[k]) f[k].value = v;

  const aplicar = () => {
    const d = Object.fromEntries([...new FormData(f)].filter(([, v]) => String(v).trim() !== ""));
    const invertido = d.de && d.ate && d.de > d.ate;
    f.de.classList.toggle("invalido", !!invertido);
    f.ate.classList.toggle("invalido", !!invertido);
    if (invertido) return toast("A data inicial do período é depois da data final.", "erro");
    S.filtro = d;
    S.pag = 1;
    marcarRapidos();
    carregarLista();
  };
  const aplicarDigitando = debounce(aplicar, 350);
  f.q.addEventListener("input", aplicarDigitando);
  ["de", "ate", "forma", "tipo", "quitado"].forEach((n) => f[n].addEventListener("change", aplicar));
  $$("[data-q]", f).forEach((b) => (b.onclick = () => { const [de, ate] = periodoRapido(b.dataset.q); f.de.value = de; f.ate.value = ate; aplicar(); }));
  $("[data-limpar]", f).onclick = () => { f.reset(); aplicar(); };
  $("[data-exportar]").onclick = exportarLancamentos;
  marcarRapidos();
  carregarLista();
}

function marcarRapidos() {
  $$(".rapidos [data-q]").forEach((b) => {
    const [de, ate] = periodoRapido(b.dataset.q);
    b.classList.toggle("on", (S.filtro.de || "") === de && (S.filtro.ate || "") === ate);
  });
}

async function exportarLancamentos() {
  const qs = new URLSearchParams({ empresa: S.empresa, ...S.filtro });
  if (!MODO_LOCAL) return (window.location.href = `/api/lancamentos/exportar?${qs}`);
  try {
    const r = await api("GET", `/api/lancamentos/exportar?${qs}`);
    baixarArquivo(r.arquivo, "﻿" + r.conteudo, r.tipo);
  } catch (x) { toast(x.message, "erro"); }
}

async function carregarLista() {
  const lista = $("#lista");
  if (!lista) return;
  const atual = seqLista();
  lista.classList.add("carregando");
  try {
    let r = await api("GET", `/api/lancamentos?${new URLSearchParams({ empresa: S.empresa, pagina: S.pag, tamanho: TAM_PAGINA, ...S.filtro })}`);
    // a página atual pode ter ficado vazia (ex.: excluiu o último item da última página)
    if (!r.itens.length && r.quantidade > 0 && S.pag > 1) {
      S.pag = Math.ceil(r.quantidade / TAM_PAGINA);
      r = await api("GET", `/api/lancamentos?${new URLSearchParams({ empresa: S.empresa, pagina: S.pag, tamanho: TAM_PAGINA, ...S.filtro })}`);
    }
    if (!atual() || !$("#lista")) return;
    renderKpis(r);
    renderTabela(r);
  } catch (x) {
    if (atual()) toast(x.message, "erro");
  } finally {
    if (atual()) lista.classList.remove("carregando");
  }
}

function renderKpis(r) {
  $("#kpis").innerHTML = `
    <div><small>Lançamentos</small><b>${r.quantidade.toLocaleString("pt-BR")}</b></div>
    ${FORMAS.map((f) => `<div><small>${f.nome}</small><b class="${r.soma[f.k] ? "" : "vazio"}">${fmtBRL(r.soma[f.k])}</b></div>`).join("")}
    <div><small>Total filtrado</small><b>${fmtBRL(r.soma.total)}</b></div>`;
  // 6 colunas: lançamentos + 4 formas + total
}

const celula = (c) => (c ? `<td class="din">${fmtNum(c)}</td>` : `<td class="din vazio">–</td>`);

function renderTabela(r) {
  const lista = $("#lista");
  if (!r.itens.length) {
    lista.innerHTML = `<div class="vazio-box">${ic("i-search")}<b>Nenhum lançamento encontrado</b>Ajuste os filtros ou o período.</div>`;
    return;
  }
  const admin = S.usuario.admin;
  lista.innerHTML = `
    <div class="tabela-box rolagem">
      <table class="t">
        <thead><tr>
          <th>Data</th><th class="quebra">Fornecedor / Transportador</th><th>NFS-e/RPS</th><th>Carga</th><th>Tipo</th>
          <th class="r">Dinheiro</th><th class="r">Débito</th><th class="r">Crédito</th><th class="r">Boleto</th><th class="r">Total</th>
          <th class="c">Quitado</th><th class="c">Ações</th>
        </tr></thead>
        <tbody>
          ${r.itens.map((l) => `
            <tr class="clicavel" data-id="${esc(l.id)}">
              <td class="num">${fmtData(l.data)}<span class="dds">${diaSemana(l.data)}</span></td>
              <td class="forn">${esc(l.fornecedor)}${l.obs ? `<span class="obs">${esc(l.obs)}</span>` : ""}</td>
              <td class="num">${esc(l.nf)}</td>
              <td class="num">${esc(l.carga) || '<span class="vazio">–</span>'}</td>
              <td>${seloTipo(l.tipo)}</td>
              ${celula(l.dinheiro)}${celula(l.debito)}${celula(l.credito)}${celula(l.boleto)}
              <td class="din total">${fmtNum(l.total)}</td>
              <td class="c"><button class="selo ${l.quitado ? "s-green" : "s-amber"}" data-quit title="Clique para marcar como ${l.quitado ? "não quitado" : "quitado"}">${l.quitado ? ic("i-check") + "Sim" : "Não"}</button></td>
              <td class="c"><span class="acoes-linha">
                <button class="btn-icon" data-edit title="Editar" aria-label="Editar">${ic("i-edit")}</button>
                ${admin ? `<button class="btn-icon danger" data-del title="Excluir" aria-label="Excluir">${ic("i-trash")}</button>` : ""}
              </span></td>
            </tr>`).join("")}
        </tbody>
      </table>
    </div>
    ${paginacao(r)}`;

  const porId = Object.fromEntries(r.itens.map((l) => [String(l.id), l]));
  $$("tbody tr", lista).forEach((tr) => {
    const l = porId[tr.dataset.id];
    tr.onclick = (e) => {
      if (e.target.closest("[data-quit],[data-del]")) return;
      abrirEdicao(l, carregarLista);
    };
    $("[data-quit]", tr).onclick = () => alternarQuitado(l, carregarLista);

}

function paginacao(r) {
  const paginas = Math.max(1, Math.ceil(r.quantidade / r.tamanho));
  const ini = (r.pagina - 1) * r.tamanho + 1;
  const fim = Math.min(r.quantidade, r.pagina * r.tamanho);
  return `<div class="paginacao">
    <span>Exibindo ${ini.toLocaleString("pt-BR")}–${fim.toLocaleString("pt-BR")} de ${r.quantidade.toLocaleString("pt-BR")}</span><span class="esp"></span>
    ${paginas > 1 ? `
      <button class="btn btn-outline btn-sm" data-pg="${r.pagina - 1}" ${r.pagina <= 1 ? "disabled" : ""}>${ic("i-left")}Anterior</button>
      <span>Página ${r.pagina} de ${paginas}</span>
      <button class="btn btn-outline btn-sm" data-pg="${r.pagina + 1}" ${r.pagina >= paginas ? "disabled" : ""}>Próxima${ic("i-right")}</button>` : ""}
  </div>`;
}

const seqFluxo = sequenciador();

function paginaFluxo() {
  if (!S.mes) S.mes = hojeISO().slice(0, 7);

    <div class="print-cab"><img src="${IMG.azul}" alt=""><div id="print-tit"></div></div>
    <div id="fx-periodo" class="nao-imprimir"></div>
    <div class="fluxo-grid" id="fluxo-resumo"></div>

      <div class="card-h">
        <h2><span class="barra"></span>Totais por dia · <span id="tit-mes"></span></h2>
        <span class="esp"></span>
        <div class="seg seg-sm nao-imprimir" id="seg-tab" role="group" aria-label="Filtrar tabela">
          <button data-t="todas">Todas as cargas</button><button data-t="agendada">Agendadas</button><button data-t="sem_agenda" class="red">Sem agenda</button>
        </div>
      </div>
      <div id="fluxo-tabela"></div>
    </section>`;

  const mudarMes = (delta) => {
    const [a, m] = S.mes.split("-").map(Number);

    $("#mes").value = S.mes;
    S.dia = "";

async function carregarFluxo() {
  const box = $("#fluxo-resumo");
  if (!box) return;
  const atual = seqFluxo();
  box.classList.add("carregando");
  try {
    const fx = await api("GET", `/api/fluxo?empresa=${S.empresa}&mes=${S.mes}`);
    if (!atual() || !$("#fluxo-resumo")) return;
    S.fluxo = fx;
    renderFluxo();
  } catch (x) {
    if (atual()) toast(x.message, "erro");
  } finally {
    if (atual()) $("#fluxo-resumo")?.classList.remove("carregando");
  }
}

function linhasFluxo() {
  return S.fluxo.dias
    .map((d) => ({ data: d.data, v: S.tipoTabela === "todas" ? somar(somar(zeros(), d.agendada), d.sem_agenda) : { ...d[S.tipoTabela] } }))
    .filter((l) => somaObj(l.v) > 0);
}

function renderFluxo() {
  const fx = S.fluxo;
  if (!fx || fx.mes !== S.mes) return;
  const [a, m] = S.mes.split("-").map(Number);
  const nDias = new Date(a, m, 0).getDate();
  const porData = Object.fromEntries(fx.dias.map((d) => [d.data, d]));
  if (S.dia && !S.dia.startsWith(S.mes)) S.dia = "";

  let opts = `<option value="">Mês inteiro</option>`;
  for (let d = 1; d <= nDias; d++) {
    const iso = `${S.mes}-${String(d).padStart(2, "0")}`;
    const tem = porData[iso];
    opts += `<option value="${iso}">${fmtData(iso)} · ${diaSemana(iso)}${tem ? ` · ${fmtBRL(somaObj(tem.agendada) + somaObj(tem.sem_agenda))}` : ""}</option>`;
  }
  $("#dia").innerHTML = opts;
  $("#dia").value = S.dia;

  const ag = zeros(), sa = zeros();
  let qtd = 0;
  for (const d of fx.dias) {
    if (S.dia && d.data !== S.dia) continue;
    somar(ag, d.agendada); somar(sa, d.sem_agenda); qtd += d.quantidade;
  }
  const tot = somar(somar(zeros(), ag), sa);
  const periodo = S.dia ? `${fmtData(S.dia)} (${diaSemana(S.dia)})` : nomeMes(S.mes);
  $("#print-tit").innerHTML = `Fluxo de caixa · ${esc(rotuloEmpresa(S.empresa))}<br>${esc(periodo)}`;
  $("#fx-periodo").innerHTML = S.dia
    ? `<span class="filtro-dia">Mostrando o dia ${fmtData(S.dia)} (${diaSemana(S.dia)})<button data-limpar-dia title="Voltar ao mês inteiro" aria-label="Voltar ao mês inteiro">${ic("i-x")}</button></span>`
    : "";
  $("[data-limpar-dia]")?.addEventListener("click", () => { S.dia = ""; renderFluxo(); });
  $("#fx-periodo").style.display = S.dia ? "" : "none";

  const caixa = (titulo, cls, barra, v) => `
    <section class="card caixa-tipo ${cls}">
      <div class="card-h"><h2><span class="barra ${barra}"></span>${titulo}</h2></div>
      <ul class="formas-lista">
        ${FORMAS.map((f) => `<li><span class="ic">${ic(f.ic)}</span><span class="nm">${f.nome}</span><span class="vl ${v[f.k] ? "" : "zero"}">${fmtBRL(v[f.k])}</span></li>`).join("")}
      </ul>
      <div class="subtotal"><span>Subtotal</span><b>${fmtBRL(somaObj(v))}</b></div>
    </section>`;
  $("#fluxo-resumo").innerHTML = `
    ${caixa("Cargas agendadas", "", "navy", ag)}
    ${caixa("Cargas sem agenda", "sem", "", sa)}
    <section class="card hero">
      <div class="hero-in">
        <small>Valor total</small>
        <div class="grande">${fmtBRL(somaObj(tot))}</div>
        <div class="per">${esc(periodo)} · ${qtd.toLocaleString("pt-BR")} ${qtd === 1 ? "lançamento" : "lançamentos"}</div>
        <div class="hero-tipos"><span>Agendadas: <b>${fmtBRL(somaObj(ag))}</b></span><span>Sem agenda: <b>${fmtBRL(somaObj(sa))}</b></span></div>
        <div class="hero-div">${FORMAS.map((f) => `<div><small>${f.nome}</small><b>${fmtBRL(tot[f.k])}</b></div>`).join("")}</div>
      </div>
    </section>`;

  $$("#seg-tab button").forEach((b) => b.classList.toggle("on", b.dataset.t === S.tipoTabela));
  $("#tit-mes").textContent = nomeMes(S.mes);
  const linhas = linhasFluxo();
  const box = $("#fluxo-tabela");
  if (!linhas.length) {
    box.innerHTML = `<div class="vazio-box">${ic("i-chart")}<b>Sem lançamentos em ${esc(nomeMes(S.mes))}</b>Escolha outro mês ou registre pagamentos em Novo lançamento.</div>`;
    return;
  }
  const totMes = linhas.reduce((acc, l) => somar(acc, l.v), zeros());
  const cel = (c) => (c ? `<td class="din">${fmtBRL(c)}</td>` : `<td class="din vazio">–</td>`);
  box.innerHTML = `
    <div class="tabela-box rolagem">
      <table class="t">
        <thead><tr><th>Data</th><th class="r">Dinheiro</th><th class="r">Débito</th><th class="r">Crédito</th><th class="r">Boleto</th><th class="r">Total do dia</th></tr></thead>
        <tbody>
          ${linhas.map((l) => `
            <tr class="clicavel ${l.data === S.dia ? "sel" : ""}" data-dia="${l.data}" title="Clique para ver o resumo deste dia">
              <td class="num"><b>${fmtData(l.data)}</b><span class="dds">${diaSemana(l.data)}</span></td>
              ${cel(l.v.dinheiro)}${cel(l.v.debito)}${cel(l.v.credito)}${cel(l.v.boleto)}
              <td class="din total">${fmtBRL(somaObj(l.v))}</td>
            </tr>`).join("")}
        </tbody>
        <tfoot><tr>
          <td>TOTAL ${esc(nomeMes(S.mes).toUpperCase())}</td>
          <td class="r">${fmtBRL(totMes.dinheiro)}</td><td class="r">${fmtBRL(totMes.debito)}</td>
          <td class="r">${fmtBRL(totMes.credito)}</td><td class="r">${fmtBRL(totMes.boleto)}</td>
          <td class="r">${fmtBRL(somaObj(totMes))}</td>
        </tr></tfoot>
      </table>
    </div>`;
  $$("tr[data-dia]", box).forEach((tr) => (tr.onclick = () => {
    S.dia = S.dia === tr.dataset.dia ? "" : tr.dataset.dia;
    renderFluxo();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }));
}

function exportarFluxo() {
  if (!S.fluxo) return;
  const linhas = linhasFluxo();
  const n = (c) => (c ? (c / 100).toFixed(2).replace(".", ",") : "");
  const rotulo = { todas: "TODAS AS CARGAS", agendada: "AGENDADAS", sem_agenda: "SEM AGENDA" }[S.tipoTabela];
  let csv = `FLUXO DE CAIXA - ${nomeMes(S.mes).toUpperCase()} - ${rotuloEmpresa(S.empresa)} - ${rotulo}\r\nDATA;DINHEIRO;DEBITO;CREDITO;BOLETO;TOTAL\r\n`;
  const tot = zeros();
  for (const l of linhas) {
    somar(tot, l.v);
    csv += [fmtData(l.data), n(l.v.dinheiro), n(l.v.debito), n(l.v.credito), n(l.v.boleto), n(somaObj(l.v))].join(";") + "\r\n";
  }
  csv += ["TOTAL", n(tot.dinheiro), n(tot.debito), n(tot.credito), n(tot.boleto), n(somaObj(tot))].join(";") + "\r\n";
  baixarArquivo(`fluxo_${S.empresa}_${S.mes}.csv`, "﻿" + csv, "text/csv;charset=utf-8");
}

    <section class="card"><div class="card-b legenda-perfis">
      <div><span class="selo s-red">Administrador</span> Acesso total: lança e consulta nos dois CDs, exclui lançamentos, gerencia usuários e faz backup.</div>
      <div><span class="selo s-navy">Perfil CD</span> Lança, edita e consulta somente nos CDs liberados (CD 1 · 501 e/ou CD 2 · 507). Não exclui lançamentos.</div>
    </div></section>`;
  $("[data-novo-user]").onclick = () => formUsuario();
  try {
    const lista = await api("GET", "/api/usuarios");
    if (S.pagina !== "usuarios") return;
    $("#lista-users").innerHTML = `
      <div class="tabela-box"><table class="t">
        <thead><tr><th>Nome</th><th>Login</th><th>Perfil</th><th>Acesso</th><th>Situação</th><th>Criado em</th><th class="c">Ações</th></tr></thead>
        <tbody>${lista.map((u) => `
          <tr data-id="${esc(u.id)}">
            <td><b>${esc(u.nome)}</b>${u.id === S.usuario.id ? ' <span class="selo s-gray">você</span>' : ""}</td>
            <td>${esc(u.usuario)}</td>
            <td>${u.admin ? '<span class="selo s-red">Administrador</span>' : '<span class="selo s-navy">Perfil CD</span>'}</td>
            <td>${u.empresas.map((e) => `<span class="selo s-gray">${esc(rotuloEmpresa(e))}</span>`).join(" ")}</td>
            <td>${u.ativo ? '<span class="selo s-green">Ativo</span>' : '<span class="selo s-gray">Inativo</span>'}</td>
            <td class="num">${fmtData(u.criado_em)}</td>
            <td class="c"><span class="acoes-linha">
              <button class="btn-icon" data-edit title="Editar" aria-label="Editar">${ic("i-edit")}</button>
              ${u.id === S.usuario.id ? "" : `<button class="btn-icon danger" data-del title="Excluir" aria-label="Excluir">${ic("i-trash")}</button>`}
            </span></td>
          </tr>`).join("")}</tbody>
      </table></div>`;
    const porId = Object.fromEntries(lista.map((u) => [String(u.id), u]));
    $$("#lista-users tbody tr").forEach((tr) => {
      const u = porId[tr.dataset.id];
      $("[data-edit]", tr).onclick = () => formUsuario(u);
      const del = $("[data-del]", tr);
      if (del) del.onclick = async () => {
        if (!(await confirmar("Excluir usuário", `Excluir o usuário <b>${esc(u.nome)}</b> (${esc(u.usuario)})?<br>Os lançamentos feitos por ele continuam no sistema.`, "Excluir", true))) return;
        try { await api("DELETE", `/api/usuarios/${u.id}`); toast("Usuário excluído."); paginaUsuarios(); }
        catch (x) { toast(x.message, "erro"); }
      };
    });
  } catch (x) { toast(x.message, "erro"); }
}

function formUsuario(u = null) {
  const novo = !u;
  const emps = new Set(u ? u.empresas : []);
  modal({
    titulo: novo ? "Novo usuário" : `Editar usuário · ${u.usuario}`,
    largura: 560,
    corpo: `
      <div class="field"><label>Nome completo</label><input class="input" name="nome" value="${esc(u?.nome || "")}"></div>
      <div class="field"><label>Usuário (login)</label><input class="input" name="usuario" value="${esc(u?.usuario || "")}" placeholder="ex.: joao.silva" autocapitalize="off" ${!novo && INFO.loginFixo ? "disabled" : ""}></div>
      ${!novo && INFO.senhaSoPropria
        ? `<div class="dica" style="font-size:13px">A senha só pode ser trocada pelo próprio usuário (ícone ${ic("i-key")} no menu, em <b>Alterar minha senha</b>). Se ele esqueceu, exclua este usuário e crie um novo login.</div>`
        : `<div class="field"><label>${novo ? "Senha" : "Nova senha"}</label><input class="input" name="senha" type="password" autocomplete="new-password" placeholder="${novo ? "Mínimo 6 caracteres" : "Deixe em branco para manter a atual"}"></div>`}
      <div class="field"><span class="rotulo">Perfil</span>
        <label class="opcao-card"><input type="radio" name="perfil" value="admin" ${u?.admin ? "checked" : ""}>
          <div><b>Administrador</b><span>Todas as permissões nos dois CDs, inclusive usuários e backup.</span></div></label>
        <label class="opcao-card"><input type="radio" name="perfil" value="cd" ${u?.admin ? "" : "checked"}>
          <div><b>Perfil CD</b><span>Lança informações financeiras somente nos CDs marcados abaixo.</span></div></label>
      </div>
      <div class="field" data-cds><span class="rotulo">CDs liberados</span>
        <div class="marcas">${S.empresas.map((e) => `<label><input type="checkbox" name="emp" value="${e.codigo}" ${emps.has(e.codigo) ? "checked" : ""}>${esc(rotuloEmpresa(e.codigo))}</label>`).join("")}</div>
      </div>
      ${novo ? "" : `<label class="switch"><input type="checkbox" name="ativo" ${u.ativo ? "checked" : ""}><span class="trilho"></span>Usuário ativo (pode entrar no sistema)</label>`}
      <div class="erro-form hidden"></div>`,
    botoes: [
      { txt: "Cancelar", valor: false },
      {
        txt: novo ? "Criar usuário" : "Salvar", cls: "btn-primary", acao: async (m) => {
          const g = (n) => $(`[name=${n}]`, m);
          const corpo = {
            nome: g("nome").value, usuario: g("usuario").value, senha: g("senha") ? g("senha").value : "",
            admin: $("[name=perfil]:checked", m).value === "admin",
            empresas: $$("[name=emp]:checked", m).map((c) => Number(c.value)),
          };
          if (!novo) corpo.ativo = g("ativo").checked;
          try {
            await api(novo ? "POST" : "PUT", novo ? "/api/usuarios" : `/api/usuarios/${u.id}`, corpo);
            toast(novo ? "Usuário criado." : "Usuário atualizado.");
            if (!novo && u.id === S.usuario.id) {
              S.usuario = (await api("GET", "/api/status")).usuario;
              renderSidebar();
            }
            paginaUsuarios();
            return true;
          } catch (x) { mostrarErro(m, x.message); return false; }
        },
      },
    ],
  });
  const m = $$(".modal").pop();
  const pintar = () => {
    const adm = $("[name=perfil]:checked", m).value === "admin";
    $$(".opcao-card", m).forEach((rc) => rc.classList.toggle("on", $("input", rc).checked));
    $("[data-cds]", m).style.display = adm ? "none" : "";
  };
  $$("[name=perfil]", m).forEach((r) => (r.onchange = pintar));
  pintar();
}

/* ---------------------------------------------------------------- página: backup (admin) */

function paginaBackup() {
  const fb = INFO.modo === "firebase";
  cabecalho("Backup dos dados",
    fb ? "Os dados ficam no Firebase. Baixe uma cópia de segurança com frequência." : "Os dados desta versão ficam somente neste navegador. Baixe uma cópia com frequência.");
  $("#main").innerHTML = `
    <div class="backup-grid">
      <section class="card backup-card">
        <span class="ico">${ic("i-download")}</span>
        <h3>Baixar backup</h3>
        <p>Gera um arquivo <b>.json</b> com <b>todos os lançamentos dos dois CDs</b> e a lista de usuários. Guarde numa pasta segura — sugestão: toda semana.</p>
        <div><button class="btn btn-primary" data-baixar>${ic("i-download")}Baixar backup agora</button></div>
      </section>
      <section class="card backup-card restaurar">
        <span class="ico">${ic("i-upload")}</span>
        <h3>Restaurar backup</h3>
        <p>${fb
          ? "Aceita backups desta versão, da versão arquivo único e o arquivo de histórico da planilha. Você escolhe entre <b>adicionar</b> aos lançamentos atuais ou <b>substituir tudo</b>."
          : "Substitui <b>todos</b> os dados deste navegador (lançamentos e usuários) pelos do arquivo."}</p>
        <div><button class="btn btn-outline" data-restaurar>${ic("i-upload")}Escolher arquivo…</button><input type="file" accept=".json,application/json" hidden data-arquivo></div>
      </section>
    </div>
    <section class="card nota">${ic("i-info")}<div>${fb
      ? "Usuários e senhas <b>não</b> são alterados por um restauro — eles ficam no login do Firebase. O backup inclui a lista de usuários apenas para consulta."
      : "Limpar os dados do navegador apaga tudo desta versão. Para levar os dados a outro computador, baixe o backup aqui e restaure lá."}</div></section>`;

  $("[data-baixar]").onclick = async (e) => {
    const b = e.currentTarget;
    b.disabled = true;
    try { const r = await api("GET", "/api/backup"); baixarArquivo(r.arquivo, r.conteudo, r.tipo); toast("Backup baixado."); }
    catch (x) { toast(x.message, "erro"); }
    finally { b.disabled = false; }
  };
  const arq = $("[data-arquivo]");
  $("[data-restaurar]").onclick = () => arq.click();
  arq.onchange = async () => {
    const file = arq.files[0];
    arq.value = "";
    if (!file) return;
    let dados;
    try { dados = JSON.parse(await file.text()); } catch { return toast("Arquivo de backup inválido.", "erro"); }
    const n = Array.isArray(dados.lancamentos) ? dados.lancamentos.length : 0;
    if (!n) return toast("O arquivo não tem lançamentos.", "erro");
    let modo = "substituir";
    if (INFO.backupMescla) {
      modo = await modal({
        titulo: "Restaurar backup",
        corpo: `<p>O arquivo <b>${esc(file.name)}</b> tem <b>${n.toLocaleString("pt-BR")}</b> lançamentos.</p>
          <p><b>Adicionar</b>: junta os lançamentos do arquivo aos que já existem (se o mesmo lançamento já existir, ele é atualizado).<br>
          <b>Substituir tudo</b>: apaga <u>todos</u> os lançamentos atuais dos dois CDs e deixa apenas os do arquivo.</p>`,
        botoes: [{ txt: "Cancelar", valor: null }, { txt: "Adicionar", cls: "btn-primary", valor: "adicionar" }, { txt: "Substituir tudo", cls: "btn-red", valor: "substituir" }],
      });
      if (!modo) return;
      if (modo === "substituir" && !(await confirmar("Confirmar substituição", "Tem certeza? Todos os lançamentos atuais serão apagados e trocados pelos do arquivo. <b>Baixe um backup antes</b> se ainda não baixou.", "Substituir tudo", true))) return;
    } else if (!(await confirmar("Restaurar backup", `O backup <b>${esc(file.name)}</b> tem <b>${n.toLocaleString("pt-BR")}</b> lançamentos.<br>Todos os dados atuais deste navegador serão <b>substituídos</b>. Continuar?`, "Restaurar", true))) return;

    toast("Restaurando backup, aguarde…", "info");
    try {
      const r = await api("POST", "/api/backup", { dados, modo });
      toast(r.mensagem || `Backup restaurado: ${r.lancamentos.toLocaleString("pt-BR")} lançamentos, ${r.usuarios} usuários.`);
      if (r.sair) { S.usuario = null; return renderLogin(); }
      S.usuario = (await api("GET", "/api/status")).usuario;
      if (!S.usuario) return renderLogin();
      if (!S.usuario.empresas.includes(S.empresa)) return renderEscolhaEmpresa();
      renderSidebar();
    } catch (x) { toast(x.message, "erro"); }
  };
}

iniciar();

</script>
</body>
</html>
