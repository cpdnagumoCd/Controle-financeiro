/* =====================================================================
   Controle Financeiro · Nagumo — identidade visual
   Navy #003567 e vermelho #F80035 (logo), tons escuros para alto contraste.
   ===================================================================== */
:root {
  --navy: #003567;
  --navy-950: #001629;
  --navy-900: #00203f;
  --navy-800: #002a52;
  --navy-700: #073f78;
  --navy-600: #0b4d8f;
  --navy-200: #c9d6e6;
  --navy-100: #e3eaf3;
  --navy-50: #f1f5fa;
  --red: #f80035;
  --red-700: #c9002b;
  --red-800: #a30023;
  --red-50: #fdecef;
  --green-700: #0d6b3c;
  --green-50: #e3f3ea;
  --amber-800: #8a5300;
  --amber-50: #fdf3e2;
  --ink: #0e1a2b;
  --ink-2: #2f3d50;
  --muted: #56647a;
  --line: #cfd8e3;
  --line-2: #e2e8f0;
  --page: #eef2f7;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(0, 32, 63, .06), 0 6px 18px rgba(0, 32, 63, .06);
  --shadow-lg: 0 24px 60px rgba(0, 16, 32, .35);
  --font: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --sidebar: 252px;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--font); font-size: 14px; line-height: 1.4; color: var(--ink); background: var(--page); -webkit-font-smoothing: antialiased; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.num { font-variant-numeric: tabular-nums; }
.hidden { display: none !important; }
button { font: inherit; cursor: pointer; color: inherit; }
input, select, textarea { font: inherit; color: inherit; }
a { color: var(--navy-600); }
:focus-visible { outline: 3px solid rgba(248, 0, 53, .35); outline-offset: 2px; }

/* ---------------------------------------------------------------- botões */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 40px; padding: 0 16px; border-radius: 9px; border: 1.5px solid transparent;
  font-weight: 650; white-space: nowrap; transition: background .15s, border-color .15s, color .15s, box-shadow .15s;
}
a.btn { text-decoration: none; }
.btn-primary { background: var(--navy); color: #fff; }
.btn-primary:hover { background: var(--navy-800); }
.btn-red { background: var(--red-700); color: #fff; box-shadow: 0 4px 12px rgba(201, 0, 43, .25); }
.btn-red:hover { background: var(--red-800); }
.btn-outline { background: #fff; color: var(--navy); border-color: var(--navy-200); }
.btn-outline:hover { border-color: var(--navy); background: var(--navy-50); }
.btn-ghost { background: transparent; color: var(--navy); }
.btn-ghost:hover { background: var(--navy-100); }
.btn-sm { height: 32px; padding: 0 11px; font-size: 13px; border-radius: 8px; }
.btn-lg { height: 46px; padding: 0 22px; font-size: 15px; }
.btn[disabled] { opacity: .55; cursor: not-allowed; box-shadow: none; }
.btn-icon { width: 34px; height: 34px; padding: 0; border-radius: 8px; background: transparent; border: 0; color: var(--navy); display: inline-flex; align-items: center; justify-content: center; }
.btn-icon:hover { background: var(--navy-100); }
.btn-icon.danger { color: var(--red-700); }
.btn-icon.danger:hover { background: var(--red-50); }
kbd { font: 600 11px var(--font); background: rgba(255, 255, 255, .18); border-radius: 4px; padding: 1px 5px; }

/* ---------------------------------------------------------------- campos */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .rotulo { font-size: 12px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; color: var(--ink-2); }
.req { color: var(--red-700); }
.input {
  height: 42px; padding: 0 12px; width: 100%; border: 1.5px solid var(--line); border-radius: 9px; background: #fff;
  transition: border-color .15s, box-shadow .15s;
}
.input:hover { border-color: #a9b6c7; }
.input:focus { outline: none; border-color: var(--navy); box-shadow: 0 0 0 3px rgba(0, 53, 103, .15); }
.input.invalido { border-color: var(--red-700); box-shadow: 0 0 0 3px rgba(201, 0, 43, .12); }
.input:disabled { background: var(--page); color: var(--ink-2); cursor: not-allowed; }
.input-icone { position: relative; }
.input-icone > svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.input-icone > .input { padding-left: 38px; }
.dinheiro { position: relative; }
.dinheiro > span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 650; pointer-events: none; }
.dinheiro > .input { padding-left: 40px; text-align: right; font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
.dica { font-size: 12px; color: var(--muted); }
.dica-inline { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--muted); }

.seg { display: inline-flex; background: var(--navy-50); border: 1.5px solid var(--line); border-radius: 10px; padding: 3px; gap: 3px; align-self: flex-start; }
.seg button { border: 0; background: transparent; color: var(--ink-2); height: 34px; padding: 0 14px; border-radius: 7px; font-weight: 650; display: inline-flex; align-items: center; gap: 7px; }
.seg button:hover { color: var(--navy); background: #fff; }
.seg button.on { background: var(--navy); color: #fff; box-shadow: 0 1px 3px rgba(0, 32, 63, .25); }
.seg button.on.red { background: var(--red-700); }
.seg-sm button { height: 28px; padding: 0 11px; font-size: 13px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 7px; height: 40px; padding: 0 15px; border: 1.5px solid var(--line); background: #fff; color: var(--ink-2); border-radius: 999px; font-weight: 650; }
.chip:hover { border-color: var(--navy); color: var(--navy); }
.chip.on { background: var(--navy); border-color: var(--navy); color: #fff; }

.switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; font-weight: 650; color: var(--ink-2); height: 42px; }
.switch input { position: absolute; opacity: 0; pointer-events: none; }
.switch .trilho { width: 44px; height: 26px; border-radius: 999px; background: #b3bfcd; position: relative; transition: background .15s; flex: none; }
.switch .trilho::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0, 0, 0, .25); }
.switch input:checked + .trilho { background: var(--green-700); }
.switch input:checked + .trilho::after { transform: translateX(18px); }
.switch input:focus-visible + .trilho { outline: 3px solid rgba(0, 53, 103, .3); outline-offset: 2px; }

/* ---------------------------------------------------------------- selos */
.selo { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; border: 0; }
.selo svg { width: 13px; height: 13px; }
.s-navy { background: var(--navy-100); color: var(--navy); }
.s-red { background: var(--red-50); color: var(--red-800); }
.s-green { background: var(--green-50); color: var(--green-700); }
.s-amber { background: var(--amber-50); color: var(--amber-800); }
.s-gray { background: #e9edf2; color: var(--ink-2); }
button.selo { cursor: pointer; }
button.selo:hover { box-shadow: inset 0 0 0 1.5px currentColor; }

/* ---------------------------------------------------------------- telas de acesso */
.acesso {
  min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
  background:
    radial-gradient(1100px 600px at 105% -10%, rgba(248, 0, 53, .22), transparent 60%),
    radial-gradient(900px 520px at -10% 110%, rgba(11, 77, 143, .6), transparent 60%),
    var(--navy-900);
}
.acesso-card { width: 100%; max-width: 440px; background: #fff; border-radius: 18px; padding: 36px 34px 30px; box-shadow: var(--shadow-lg); }
.carregando-card { text-align: center; }
.acesso-logo { display: block; height: 56px; margin: 0 auto 22px; }
.acesso-split { width: 100%; max-width: 920px; display: grid; grid-template-columns: 1fr 1.05fr; background: #fff; border-radius: 20px; overflow: hidden; box-shadow: var(--shadow-lg); }
.acesso-marca { position: relative; overflow: hidden; color: #fff; padding: 40px 36px; display: flex; flex-direction: column; gap: 18px; background: linear-gradient(160deg, var(--navy) 0%, var(--navy-900) 100%); }
.acesso-marca::after { content: ""; position: absolute; width: 300px; height: 300px; right: -110px; bottom: -110px; border-radius: 50%; background: var(--red); }
.acesso-marca img { height: 40px; align-self: flex-start; position: relative; z-index: 1; }
.acesso-marca h2 { margin: 18px 0 0; font-size: 28px; line-height: 1.15; letter-spacing: -.01em; position: relative; z-index: 1; }
.acesso-marca p { margin: 0; opacity: .85; font-size: 15px; position: relative; z-index: 1; max-width: 330px; }
.acesso-marca ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 12px; position: relative; z-index: 1; }
.acesso-marca li { display: flex; gap: 10px; align-items: center; font-weight: 600; }
.acesso-marca li svg { width: 30px; height: 30px; padding: 6px; border-radius: 8px; background: rgba(255, 255, 255, .12); }
.acesso-form { padding: 40px 38px; display: flex; flex-direction: column; justify-content: center; }
.acesso-form h1, .acesso-card h1 { margin: 0 0 4px; font-size: 24px; color: var(--navy); }
.acesso-card h1 { text-align: center; }
.sub { margin: 0 0 24px; color: var(--muted); }
.acesso-card .sub { text-align: center; }
.acesso-form form, .acesso-card form { display: grid; gap: 16px; }
.acesso-form form .btn, .btn-bloco { width: 100%; height: 46px; }
.dia-vazio svg { width: 34px; height: 34px; color: #aab5c4; }
.rodape-acesso { margin-top: 18px; font-size: 12.5px; color: var(--muted); }
.erro-form { background: var(--red-50); color: var(--red-800); border: 1px solid #f3b3c1; border-radius: 9px; padding: 10px 12px; font-weight: 600; display: flex; gap: 8px; align-items: flex-start; }
.erro-form svg { margin-top: 1px; }
.spinner { width: 40px; height: 40px; margin: 6px auto 0; border-radius: 50%; border: 4px solid var(--navy-100); border-top-color: var(--red); animation: gira .8s linear infinite; }
.carregando-card .sub { margin: 14px 0 0; }
@keyframes gira { to { transform: rotate(360deg); } }

.empresas { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.empresa-btn { position: relative; text-align: left; border: 2px solid var(--line); background: #fff; border-radius: 14px; padding: 20px; display: grid; gap: 3px; transition: border-color .15s, transform .15s, box-shadow .15s; }
.empresa-btn:hover:not([disabled]) { border-color: var(--navy); transform: translateY(-2px); box-shadow: var(--shadow); }
.empresa-btn .ico { width: 46px; height: 46px; border-radius: 12px; background: var(--navy); color: #fff; display: grid; place-items: center; margin-bottom: 10px; }
.empresa-btn .ico svg { width: 24px; height: 24px; }
.empresa-btn .nome { font-size: 22px; font-weight: 800; color: var(--navy); }
.empresa-btn .cod { font-size: 13px; color: var(--muted); font-weight: 600; }
.empresa-btn .cod b { color: var(--red-700); }
.empresa-btn[disabled] { cursor: not-allowed; background: #f5f7fa; }
.empresa-btn[disabled] .ico { background: #9aa7b8; }
.empresa-btn[disabled] .nome { color: #7a879a; }
.empresa-btn .cadeado { position: absolute; top: 14px; right: 14px; display: inline-flex; gap: 5px; align-items: center; font-size: 12px; font-weight: 700; color: var(--muted); }

/* ---------------------------------------------------------------- estrutura (menu lateral + conteúdo) */
.shell { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); min-height: 100vh; }
.sidebar {
  position: sticky; top: 0; height: 100vh; overflow-y: auto; z-index: 30;
  background: linear-gradient(180deg, var(--navy) 0%, var(--navy-900) 100%); color: #fff;
  display: flex; flex-direction: column; gap: 18px; padding: 20px 14px 16px;
}
.sb-topo { display: flex; align-items: center; justify-content: space-between; padding: 0 6px; }
.sb-topo img { height: 34px; display: block; }
.sb-fechar { display: none; color: #fff; }
.sb-fechar:hover { background: rgba(255, 255, 255, .12); }
.sb-app { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: rgba(255, 255, 255, .6); padding: 0 6px; margin-top: -6px; }
.sb-empresa { background: rgba(255, 255, 255, .07); border: 1px solid rgba(255, 255, 255, .12); border-radius: 12px; padding: 12px; display: grid; gap: 10px; }
.sb-empresa small { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: rgba(255, 255, 255, .6); }
.sb-empresa .atual { display: flex; align-items: center; gap: 10px; }
.sb-empresa .atual .ico { width: 36px; height: 36px; border-radius: 10px; background: var(--red-700); display: grid; place-items: center; flex: none; }
.sb-empresa .atual b { font-size: 18px; display: block; line-height: 1.1; }
.sb-empresa .atual span { font-size: 12px; color: rgba(255, 255, 255, .7); }
.sb-cds { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: rgba(0, 0, 0, .2); border-radius: 9px; padding: 3px; }
.sb-cds button { border: 0; background: transparent; color: rgba(255, 255, 255, .78); border-radius: 7px; height: 30px; font-weight: 700; font-size: 13px; }
.sb-cds button:hover:not([disabled]) { background: rgba(255, 255, 255, .1); color: #fff; }
.sb-cds button.on { background: #fff; color: var(--navy); }
.sb-cds button[disabled] { opacity: .35; cursor: not-allowed; }
.sb-nav { display: grid; gap: 4px; }
.sb-nav .titulo { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: rgba(255, 255, 255, .5); padding: 8px 12px 4px; }
.sb-nav a { display: flex; align-items: center; gap: 12px; padding: 0 12px; height: 44px; border-radius: 10px; color: rgba(255, 255, 255, .82); text-decoration: none; font-weight: 650; position: relative; }
.sb-nav a:hover { background: rgba(255, 255, 255, .09); color: #fff; }
.sb-nav a.on { background: #fff; color: var(--navy); box-shadow: 0 4px 14px rgba(0, 0, 0, .2); }
.sb-nav a.on svg { color: var(--red-700); }
.sb-espaco { flex: 1; }
.sb-usuario { display: flex; align-items: center; gap: 10px; padding: 12px 8px 4px; border-top: 1px solid rgba(255, 255, 255, .12); }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: #fff; color: var(--navy); display: grid; place-items: center; font-weight: 800; font-size: 13px; flex: none; }
.sb-usuario .quem { flex: 1; min-width: 0; line-height: 1.2; }
.sb-usuario .quem b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-usuario .quem small { display: block; color: rgba(255, 255, 255, .65); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-usuario .btn-icon { width: 32px; height: 32px; flex: none; }
.sb-usuario .btn-icon { color: rgba(255, 255, 255, .8); }
.sb-usuario .btn-icon:hover { background: rgba(255, 255, 255, .12); color: #fff; }

.topo-movel { display: none; }
.conteudo { min-width: 0; display: flex; flex-direction: column; }
.pagebar { position: sticky; top: 0; z-index: 20; background: rgba(238, 242, 247, .94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line-2); }
.pagebar-in { max-width: 1480px; margin: 0 auto; padding: 18px 28px 14px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.pagebar h1 { margin: 0; font-size: 22px; color: var(--navy); letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; }
.pagebar p { margin: 2px 0 0; color: var(--muted); }
.pagebar .acoes { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
main { width: 100%; max-width: 1480px; margin: 0 auto; padding: 22px 28px 48px; display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); }

/* ---------------------------------------------------------------- cartões */
.card { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--line-2); min-width: 0; }
.card-h { display: flex; align-items: center; gap: 12px; padding: 15px 20px; border-bottom: 1px solid var(--line-2); flex-wrap: wrap; }
.card-h h2 { margin: 0; font-size: 16px; color: var(--navy); display: flex; align-items: center; gap: 10px; }
.card-h h2 .barra { width: 4px; height: 18px; border-radius: 2px; background: var(--red); }
.card-h .esp { flex: 1; }
.card-b { padding: 20px; }

/* ---------------------------------------------------------------- novo lançamento */
.novo-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(330px, 1fr); gap: 20px; align-items: start; }
.flanc .grade { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px 18px; }
.flanc .c2 { grid-column: span 2; } .flanc .c3 { grid-column: span 3; } .flanc .c6 { grid-column: 1 / -1; }
.valores { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.valores .field > label { display: flex; align-items: center; gap: 6px; }
.valores .field svg { width: 15px; height: 15px; color: var(--navy); }
.flanc-rodape { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line-2); }
.flanc-rodape .esp { flex: 1; }
.total-form { display: flex; flex-direction: column; line-height: 1.15; }
.total-form small { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.total-form b { font-size: 24px; color: var(--navy); font-variant-numeric: tabular-nums; }
.aviso-edicao { background: var(--amber-50); color: var(--amber-800); border-radius: 9px; padding: 9px 12px; font-weight: 650; display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }

.painel-dia { position: sticky; top: 92px; }
.dia-totais { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line-2); border-bottom: 1px solid var(--line-2); }
.dia-totais > div { background: #fff; padding: 11px 16px; }
.dia-totais small { display: block; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.dia-totais b { font-size: 15px; font-variant-numeric: tabular-nums; }
.dia-totais .tot { grid-column: 1 / -1; background: var(--navy); color: #fff; display: flex; align-items: center; justify-content: space-between; }
.dia-totais .tot small { color: rgba(255, 255, 255, .75); }
.dia-totais .tot b { font-size: 20px; }
.dia-lista { list-style: none; margin: 0; padding: 0; max-height: calc(100vh - 430px); min-height: 160px; overflow-y: auto; }
.dia-lista li { display: flex; gap: 10px; align-items: flex-start; padding: 11px 16px; border-bottom: 1px solid var(--line-2); cursor: pointer; }
.dia-lista li:hover { background: var(--navy-50); }
.dia-lista .info { flex: 1; min-width: 0; }
.dia-lista .info b { display: block; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dia-lista .info small { color: var(--muted); font-size: 12px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 3px; }
.dia-lista .val { font-weight: 800; color: var(--navy); font-variant-numeric: tabular-nums; white-space: nowrap; }
.dia-vazio { padding: 34px 20px; text-align: center; color: var(--muted); }

/* ---------------------------------------------------------------- consulta */
.filtros { display: grid; gap: 14px; }
.filtros .linha { display: grid; grid-template-columns: minmax(280px, 340px) minmax(0, 1fr); gap: 12px 14px; align-items: end; }
.filtros .rapidos { min-height: 42px; }
.filtros .linha2 { display: grid; grid-template-columns: minmax(240px, 2fr) repeat(3, minmax(140px, 1fr)) auto; gap: 12px 14px; align-items: end; }
.periodo { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.rapidos { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.rapidos button { height: 30px; padding: 0 11px; border-radius: 7px; border: 1.5px solid var(--line); background: #fff; color: var(--ink-2); font-size: 12.5px; font-weight: 700; }
.rapidos button:hover { border-color: var(--navy); color: var(--navy); }
.rapidos button.on { background: var(--navy); color: #fff; border-color: var(--navy); }

.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); background: var(--navy-50); border-bottom: 1px solid var(--line-2); }
.kpis > div { padding: 12px 18px; border-right: 1px solid var(--line-2); min-width: 0; }
.kpis > div:last-child { border-right: 0; background: var(--navy); color: #fff; }
.kpis small { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.kpis > div:last-child small { color: rgba(255, 255, 255, .75); }
.kpis b { font-size: 16px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.kpis > div:last-child b { font-size: 18px; }

/* ---------------------------------------------------------------- tabelas */
.tabela-box { overflow: auto; }
.rolagem { max-height: max(340px, calc(100vh - 330px)); overscroll-behavior: contain; scrollbar-color: #9fb0c5 #eef2f7; }
.rolagem::-webkit-scrollbar { width: 10px; height: 10px; }
.rolagem::-webkit-scrollbar-track { background: #eef2f7; }
.rolagem::-webkit-scrollbar-thumb { background: #9fb0c5; border-radius: 6px; border: 2px solid #eef2f7; }
.rolagem::-webkit-scrollbar-thumb:hover { background: var(--navy-600); }
table.t { width: 100%; border-collapse: separate; border-spacing: 0; }
.t th { position: sticky; top: 0; z-index: 2; background: var(--navy); color: #fff; text-align: left; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 11px 10px; white-space: nowrap; }
.t th.r, .t td.r { text-align: right; }
.t th.c, .t td.c { text-align: center; }
.t td { padding: 9px 10px; border-bottom: 1px solid var(--line-2); white-space: nowrap; vertical-align: middle; font-size: 13.5px; }
.t th:first-child, .t td:first-child { padding-left: 16px; }
.t th:last-child, .t td:last-child { padding-right: 14px; }
.t tbody tr:nth-child(even) td { background: #f8fafc; }
.t tbody tr:hover td { background: var(--navy-50); }
.t tbody tr.clicavel { cursor: pointer; }
.t td.forn { white-space: normal; min-width: 150px; max-width: 320px; font-weight: 650; }
.t .acoes-linha .btn-icon { width: 30px; height: 30px; }
@media (max-width: 1440px) { .t td .dds { display: none; } }
.t td .obs { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
.t td.din { text-align: right; font-variant-numeric: tabular-nums; }
.t td.total { font-weight: 800; color: var(--navy); }
.t td.vazio, .vazio { color: #a3adbb; }
.t tfoot td { position: sticky; bottom: 0; z-index: 2; background: var(--navy-900); color: #fff; font-weight: 800; border: 0; padding: 12px; font-variant-numeric: tabular-nums; }
.t tr.sel td { background: #fff1f4 !important; }
.t tr.sel td:first-child { box-shadow: inset 4px 0 0 var(--red); }
.dds { color: var(--muted); font-size: 12px; margin-left: 6px; font-weight: 600; }
.acoes-linha { display: inline-flex; gap: 2px; }
.paginacao { display: flex; align-items: center; gap: 10px; padding: 12px 20px; flex-wrap: wrap; color: var(--muted); font-weight: 600; border-top: 1px solid var(--line-2); }
.paginacao .esp { flex: 1; }
.vazio-box { padding: 54px 20px; text-align: center; color: var(--muted); }
.vazio-box svg { width: 42px; height: 42px; color: #aab5c4; margin-bottom: 8px; }
.vazio-box b { display: block; color: var(--ink-2); font-size: 15px; margin-bottom: 4px; }

/* ---------------------------------------------------------------- fluxo de caixa */
.mes-nav { display: inline-flex; align-items: center; gap: 2px; background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 2px; }
.mes-nav .input { border: 0; height: 36px; width: 170px; box-shadow: none; }
.fluxo-grid { display: grid; grid-template-columns: 1fr 1fr 1.1fr; gap: 20px; }
.caixa-tipo .card-h h2 .barra.navy { background: var(--navy); }
.formas-lista { list-style: none; margin: 0; padding: 4px 20px; }
.formas-lista li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px dashed var(--line); }
.formas-lista li:last-child { border-bottom: 0; }
.formas-lista .ic { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: var(--navy-100); color: var(--navy); }
.formas-lista .nm { font-weight: 700; color: var(--ink-2); flex: 1; }
.formas-lista .vl { font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
.formas-lista .vl.zero { color: #9aa6b6; font-weight: 600; }
.subtotal { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; background: var(--navy-50); border-top: 1px solid var(--line-2); border-radius: 0 0 var(--radius) var(--radius); }
.subtotal span { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-2); }
.subtotal b { font-size: 20px; color: var(--navy); font-variant-numeric: tabular-nums; }
.caixa-tipo.sem .subtotal b { color: var(--red-700); }
.hero { background: linear-gradient(160deg, var(--navy) 0%, var(--navy-900) 100%); color: #fff; border: 0; position: relative; overflow: hidden; display: flex; flex-direction: column; }
.hero::after { content: ""; position: absolute; right: -70px; top: -70px; width: 210px; height: 210px; border-radius: 50%; background: var(--red); }
.hero-in { position: relative; z-index: 1; padding: 22px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.hero small { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; opacity: .85; }
.hero .grande { font-size: 38px; font-weight: 800; letter-spacing: -.01em; font-variant-numeric: tabular-nums; line-height: 1.1; margin: 4px 0 2px; }
.hero .per { font-weight: 600; opacity: .85; }
.hero-tipos { display: flex; gap: 18px; margin: 14px 0 16px; font-weight: 600; font-size: 13px; flex-wrap: wrap; }
.hero-div { margin-top: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: rgba(255, 255, 255, .15); border-radius: 10px; overflow: hidden; }
.hero-div > div { background: rgba(0, 20, 45, .55); padding: 10px 12px; }
.hero-div small { font-size: 10.5px; opacity: .8; }
.hero-div b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; }
.filtro-dia { display: inline-flex; align-items: center; gap: 6px; background: var(--red-50); color: var(--red-800); border-radius: 999px; padding: 4px 6px 4px 12px; font-weight: 700; font-size: 13px; }
.filtro-dia button { border: 0; background: transparent; color: inherit; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; }
.filtro-dia button:hover { background: rgba(163, 0, 35, .12); }
.filtro-dia svg { width: 14px; height: 14px; }
.print-cab { display: none; }

/* ---------------------------------------------------------------- usuários / backup */
.legenda-perfis { display: grid; gap: 10px; color: var(--ink-2); line-height: 1.5; }
.backup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.backup-card { display: flex; flex-direction: column; gap: 12px; padding: 24px; }
.backup-card .ico { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; background: var(--navy-100); color: var(--navy); }
.backup-card .ico svg { width: 24px; height: 24px; }
.backup-card.restaurar .ico { background: var(--red-50); color: var(--red-700); }
.backup-card h3 { margin: 4px 0 0; font-size: 18px; color: var(--navy); }
.backup-card p { margin: 0; color: var(--ink-2); line-height: 1.55; flex: 1; }
.nota { display: flex; gap: 12px; align-items: flex-start; padding: 16px 20px; color: var(--ink-2); line-height: 1.55; }
.nota > svg { color: var(--navy-600); margin-top: 2px; }

/* ---------------------------------------------------------------- painel lateral (edição) e modal */
#camada > * { position: fixed; inset: 0; z-index: 50; }
.fundo { position: absolute; inset: 0; background: rgba(0, 20, 40, .55); animation: aparece .15s; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 51; width: min(620px, 100%); background: var(--page); display: flex; flex-direction: column; box-shadow: var(--shadow-lg); animation: desliza .2s ease-out; }
.drawer-h { display: flex; align-items: center; gap: 12px; padding: 16px 20px; background: var(--navy); color: #fff; }
.drawer-h h3 { margin: 0; font-size: 17px; flex: 1; }
.drawer-h .btn-icon { color: #fff; }
.drawer-h .btn-icon:hover { background: rgba(255, 255, 255, .14); }
.drawer-b { flex: 1; overflow-y: auto; padding: 20px; }
.drawer .card-b { padding: 18px; }
.modal-wrap { display: grid; place-items: center; padding: 16px; z-index: 60 !important; }
.modal { position: relative; z-index: 1; background: #fff; border-radius: 16px; width: 100%; max-width: 520px; box-shadow: var(--shadow-lg); max-height: calc(100vh - 32px); overflow: auto; animation: sobe .18s; }
.modal-h { display: flex; align-items: center; padding: 18px 22px; border-bottom: 1px solid var(--line-2); }
.modal-h h3 { margin: 0; font-size: 17px; color: var(--navy); flex: 1; }
.modal-b { padding: 20px 22px; display: grid; gap: 16px; line-height: 1.55; }
.modal-b p { margin: 0; }
.modal-f { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 22px 18px; flex-wrap: wrap; }
.opcao-card { display: flex; gap: 12px; align-items: flex-start; border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer; line-height: 1.4; }
.opcao-card:hover { border-color: var(--navy); }
.opcao-card input { margin-top: 3px; accent-color: var(--navy); }
.opcao-card.on { border-color: var(--navy); background: var(--navy-50); }
.opcao-card b { color: var(--navy); display: block; }
.opcao-card span { color: var(--muted); font-size: 13px; }
.marcas { display: flex; gap: 10px; flex-wrap: wrap; }
.marcas label { display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); border-radius: 9px; padding: 9px 14px; font-weight: 700; cursor: pointer; color: var(--ink-2); }
.marcas label:has(input:checked) { border-color: var(--navy); background: var(--navy); color: #fff; }
.marcas input { accent-color: var(--red); }

#toasts { position: fixed; right: 20px; bottom: 20px; display: grid; gap: 10px; z-index: 80; }
.toast { background: var(--navy-950); color: #fff; padding: 12px 16px; border-radius: 10px; box-shadow: 0 8px 24px rgba(0, 0, 0, .3); font-weight: 600; display: flex; align-items: center; gap: 10px; min-width: 260px; max-width: 440px; animation: sobe .2s; border-left: 5px solid #37b36b; }
.toast.erro { border-left-color: var(--red); }
.toast.info { border-left-color: #5b8fd1; }
@keyframes sobe { from { transform: translateY(10px); opacity: 0; } }
@keyframes aparece { from { opacity: 0; } }
@keyframes desliza { from { transform: translateX(40px); opacity: 0; } }
.carregando { opacity: .55; pointer-events: none; transition: opacity .15s; }

/* ---------------------------------------------------------------- responsivo */
@media (max-width: 1280px) {
  .fluxo-grid { grid-template-columns: 1fr 1fr; }
  .fluxo-grid .hero { grid-column: 1 / -1; }
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .kpis > div { border-bottom: 1px solid var(--line-2); }
  .filtros .linha2 { grid-template-columns: minmax(200px, 2fr) repeat(3, minmax(130px, 1fr)); }
  .filtros .linha2 .botoes { grid-column: 1 / -1; justify-self: end; }
}
@media (max-width: 1100px) {
  .novo-grid { grid-template-columns: minmax(0, 1fr); }
  .painel-dia { position: static; }
  .dia-lista { max-height: 420px; }
}
@media (max-width: 960px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: min(300px, 86vw); height: auto; transform: translateX(-102%); transition: transform .2s ease-out; box-shadow: var(--shadow-lg); z-index: 70; }
  .shell.menu-aberto .sidebar { transform: none; }
  .shell.menu-aberto::after { content: ""; position: fixed; inset: 0; background: rgba(0, 20, 40, .55); z-index: 65; }
  .sb-fechar { display: inline-flex; }
  .topo-movel { display: flex; position: sticky; top: 0; z-index: 25; height: 58px; align-items: center; gap: 10px; padding: 0 12px; background: var(--navy); color: #fff; }
  .topo-movel img { height: 28px; }
  .topo-movel .btn-icon { color: #fff; }
  .topo-movel .btn-icon:hover { background: rgba(255, 255, 255, .12); }
  .topo-movel .esp { flex: 1; }
  .pill-emp { background: var(--red-700); color: #fff; border: 0; border-radius: 999px; height: 32px; padding: 0 12px; font-weight: 700; font-size: 13px; }
  .pagebar { position: static; }
  .pagebar-in, main { padding-left: 16px; padding-right: 16px; }
  .filtros .linha, .filtros .linha2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .filtros .periodo-campo, .filtros .busca { grid-column: 1 / -1; }
  .backup-grid { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 640px) {
  .acesso-split { grid-template-columns: minmax(0, 1fr); }
  .acesso-marca { padding: 26px 24px; }
  .acesso-marca h2 { font-size: 22px; margin-top: 6px; }
  .acesso-marca ul, .acesso-marca::after { display: none; }
  .acesso-form, .acesso-card { padding: 28px 22px; }
  .flanc .grade { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .flanc .c2, .flanc .c3 { grid-column: 1 / -1; }
  .fluxo-grid { grid-template-columns: minmax(0, 1fr); }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hero .grande { font-size: 30px; }
  .pagebar .acoes { margin-left: 0; width: 100%; }
  .mes-nav .input { width: 140px; }
  #toasts { left: 12px; right: 12px; }
  .toast { min-width: 0; }
}

/* ---------------------------------------------------------------- impressão */
@media print {
  body { background: #fff; font-size: 11px; }
  .sidebar, .topo-movel, .pagebar, .nao-imprimir, #toasts, #camada { display: none !important; }
  .shell { display: block; }
  main { padding: 0; max-width: none; }
  .card { box-shadow: none; border: 1px solid #999; break-inside: avoid; }
  .print-cab { display: flex; align-items: center; justify-content: space-between; border-bottom: 3px solid var(--navy); padding-bottom: 10px; margin-bottom: 6px; }
  .print-cab img { height: 40px; }
  .print-cab div { text-align: right; color: var(--navy); font-weight: 700; }
  .t th, .t tfoot td, .hero, .hero-div > div, .kpis > div:last-child { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .fluxo-grid { grid-template-columns: 1fr 1fr 1fr; }
  .t th, .t tfoot td { position: static; }
  .rolagem { max-height: none; overflow: visible; }
}
.t th.quebra { white-space: normal; min-width: 150px; }

</style>

/* =====================================================================
   Modo Firebase: implementa as rotas da API usadas pelo app.js com
   Firebase Authentication (login) + Cloud Firestore (dados).

   Estrutura no Firestore:
     config/setup                 -> existe depois que o 1º administrador é criado
     usuarios/{uid}               -> { nome, usuario, admin, empresas[], ativo, criado_em }
     meses/{empresa}_{AAAA-MM}    -> { empresa, mes, itens: { <id>: "<lançamento em JSON>" } }

   Um documento por empresa/mês mantém as leituras baixas (o fluxo de um mês
   inteiro custa 1 leitura), cabendo com folga no plano gratuito do Firebase.
   ===================================================================== */

(function () {
  const CFG = window.FINANCEIRO_FIREBASE_CONFIG || {};
  const DOMINIO = "@financeiro.nagumo.app"; // login "joao.silva" vira o e-mail técnico joao.silva@financeiro.nagumo.app
  const EMPRESAS = { 501: "CD 1", 507: "CD 2" };
  const FORMAS = ["dinheiro", "debito", "credito", "boleto"];
  const TIPOS = ["agendada", "sem_agenda"];
  const CAMPOS_ITEM = ["data", "fornecedor", "nf", "carga", ...FORMAS, "tipo", "quitado", "obs", "origem", "criado_por", "criado_em", "alterado_por", "alterado_em"];

  window.API_INFO = { modo: "firebase", loginFixo: true, senhaSoPropria: true, backupMescla: true };

  const configurado = !!(window.firebase && CFG.apiKey && CFG.projectId && !/^COLE_/.test(CFG.apiKey) && !/^COLE_/.test(CFG.projectId));
  let auth, fs, FieldPath, FieldValue, authPronto;
  if (configurado) {
    firebase.initializeApp(CFG);
    auth = firebase.auth();
    fs = firebase.firestore();
    FieldPath = firebase.firestore.FieldPath;
    FieldValue = firebase.firestore.FieldValue;
    authPronto = auth.setPersistence(firebase.auth.Auth.Persistence.SESSION)
      .catch(() => {})
      .then(() => new Promise((res) => { const un = auth.onAuthStateChanged((u) => { un(); res(u); }); }));
  }

  /* ---------------------------------------------------------------- utilitários */
  const erro = (status, msg, extra = {}) => Object.assign(new Error(msg), { status, dados: { erro: msg, ...extra } });
  const agora = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 19).replace("T", " "); };
  const texto = (v, max = 200) => String(v ?? "").replace(/\s+/g, " ").trim().slice(0, max);
  const dataISO = (v, campo = "Data") => {
    const s = String(v || "");
    if (!/^\d{4}-\d{2}-\d{2}$/.test(s) || isNaN(new Date(s + "T12:00:00"))) throw erro(400, `${campo} inválida.`);
    return s;
  };
  const centavos = (v, campo) => {
    if (v === null || v === undefined || v === "") return 0;
    const n = Number(v);
    if (!Number.isInteger(n)) throw erro(400, `Valor de ${campo} inválido.`);
    if (n < 0) throw erro(400, `Valor de ${campo} não pode ser negativo.`);
    return n;
  };
  const somaL = (l) => FORMAS.reduce((a, f) => a + (l[f] || 0), 0);
  const fmtBR = (iso) => iso.split("-").reverse().join("/");
  const novoId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const docIdMes = (emp, mes) => `${emp}_${mes}`;
  const email = (usuario) => usuario + DOMINIO;
  const mesesEntre = (de, ate) => {
    const out = [];
    let [a, m] = de.slice(0, 7).split("-").map(Number);
    const [a2, m2] = ate.slice(0, 7).split("-").map(Number);
    while (a < a2 || (a === a2 && m <= m2)) { out.push(`${a}-${String(m).padStart(2, "0")}`); if (++m > 12) { m = 1; a++; } }
    return out;
  };
  const somarMeses = (iso, n) => { const [a, m] = iso.slice(0, 7).split("-").map(Number); const d = new Date(a, m - 1 + n, 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; };

  function traduzir(e) {
    if (e && e.status !== undefined && e.dados) return e;
    const c = (e && e.code) || "";
    const map = {
      "permission-denied": [403, "Sem permissão para esta operação. Verifique o seu acesso com o administrador."],
      "unavailable": [0, "Sem conexão com o Firebase. Verifique a internet e tente de novo."],
      "auth/network-request-failed": [0, "Sem conexão com a internet."],
      "auth/invalid-credential": [401, "Usuário ou senha incorretos."],
      "auth/invalid-login-credentials": [401, "Usuário ou senha incorretos."],
      "auth/wrong-password": [401, "Usuário ou senha incorretos."],
      "auth/user-not-found": [401, "Usuário ou senha incorretos."],
      "auth/invalid-email": [400, "Login inválido."],
      "auth/too-many-requests": [429, "Muitas tentativas. Aguarde alguns minutos e tente de novo."],
      "auth/weak-password": [400, "A senha deve ter pelo menos 6 caracteres."],
      "auth/requires-recent-login": [401, "Por segurança, saia e entre de novo antes de trocar a senha."],
      "auth/operation-not-allowed": [500, "Ative o login por E-mail/senha no Firebase (Authentication > Sign-in method)."],
      "auth/configuration-not-found": [500, "Ative o Authentication no Firebase (Authentication > Get started > E-mail/senha)."],
    };
    const [s, msg] = map[c] || [500, `Erro no Firebase: ${(e && e.message) || e}`];
    return erro(s, msg);
  }

  /* ---------------------------------------------------------------- sessão / perfil */
  let perfil = null; // { id, nome, usuario, admin, empresas, ativo, criado_em }

  const pub = (id, d) => ({
    id, nome: d.nome, usuario: d.usuario, admin: !!d.admin,
    empresas: d.admin ? [501, 507] : (d.empresas || []).map(Number).filter((e) => EMPRESAS[e]),
    ativo: d.ativo !== false, criado_em: d.criado_em || "",
  });

  async function carregarPerfil() {
    const u = auth.currentUser;
    if (!u) { perfil = null; return null; }
    const snap = await fs.collection("usuarios").doc(u.uid).get();
    if (!snap.exists || snap.data().ativo === false) {
      perfil = null;
      await auth.signOut();
      return null;
    }
    perfil = pub(u.uid, snap.data());
    return perfil;
  }

  function atual() {
    if (!auth.currentUser || !perfil) throw erro(401, "Sessão expirada. Entre novamente.");
    return perfil;
  }
  const exigirAdmin = (u) => { if (!u.admin) throw erro(403, "Apenas administradores podem fazer isso."); };
  function exigirEmpresa(u, emp) {
    emp = Number(emp);
    if (!EMPRESAS[emp]) throw erro(400, "Empresa inválida.");
    if (!u.empresas.includes(emp)) throw erro(403, `Seu usuário não tem acesso ao ${EMPRESAS[emp]} (${emp}).`);
    return emp;
  }

  /* ---------------------------------------------------------------- cache dos meses + tempo real */
  const cache = new Map();        // docId -> { itens: Map(id -> item), ts, vivo }
  const localizacao = new Map();  // id do lançamento -> docId
  const observados = new Map();   // docId -> unsubscribe
  let ignorarEventosAte = 0;

  function guardar(docId, snap) {
    const [emp, mes] = docId.split("_");
    const itens = new Map();
    const bruto = snap.exists ? snap.data().itens || {} : {};
    for (const [id, json] of Object.entries(bruto)) {
      try {
        const o = typeof json === "string" ? JSON.parse(json) : json;
        itens.set(id, { ...o, id, empresa: Number(emp) });
        localizacao.set(id, docId);
      } catch { /* item corrompido é ignorado */ }
    }
    const antes = cache.get(docId);
    cache.set(docId, { itens, ts: Date.now(), vivo: antes ? antes.vivo : false, mes });
    return itens;
  }

  async function lerMes(emp, mes, maxIdadeMs = 0) {
    const id = docIdMes(emp, mes);
    const c = cache.get(id);
    if (c && (c.vivo || Date.now() - c.ts <= maxIdadeMs)) return c.itens;
    return guardar(id, await fs.collection("meses").doc(id).get());
  }

  async function lerTodosMeses(emp) {
    const snap = await fs.collection("meses").where("empresa", "==", emp).get();
    snap.forEach((d) => guardar(d.id, d));
    return snap.docs.map((d) => d.id);
  }

  function observar(ids) {
    for (const [id, un] of observados) {
      if (!ids.includes(id)) { un(); observados.delete(id); const c = cache.get(id); if (c) c.vivo = false; }
    }
    for (const id of ids) {
      if (observados.has(id)) continue;
      let primeiro = true;
      const un = fs.collection("meses").doc(id).onSnapshot((snap) => {
        guardar(id, snap);
        cache.get(id).vivo = true;
        if (primeiro) { primeiro = false; return; }
        if (!snap.metadata.hasPendingWrites && Date.now() > ignorarEventosAte) {
          window.dispatchEvent(new CustomEvent("dados-alterados", { detail: { doc: id } }));
        }
      }, () => { observados.delete(id); const c = cache.get(id); if (c) c.vivo = false; });
      observados.set(id, un);
    }
  }

  function pararTudo() {
    for (const un of observados.values()) un();
    observados.clear();
    cache.clear();
    localizacao.clear();
  }

  const serializar = (reg) => JSON.stringify(Object.fromEntries(CAMPOS_ITEM.map((k) => [k, reg[k] ?? (FORMAS.includes(k) || k === "quitado" ? 0 : "")])));

  function atualizarCache(docId, id, item) {
    const c = cache.get(docId);
    if (c) {
      if (item) c.itens.set(id, item); else c.itens.delete(id);
    }
    if (item) localizacao.set(id, docId); else localizacao.delete(id);
  }

  /* ---------------------------------------------------------------- regras de negócio */
  function validarUsuario(d, exigirSenha = true) {
    const nome = texto(d.nome, 80);
    const usuario = texto(d.usuario, 40).toLowerCase();
    const senha = String(d.senha || "");
    if (!nome) throw erro(400, "Informe o nome.");
    if (!/^[a-z0-9._-]{3,40}$/.test(usuario)) throw erro(400, "Usuário deve ter 3 a 40 caracteres: letras, números, ponto, hífen ou sublinhado.");
    if ((exigirSenha || senha) && senha.length < 6) throw erro(400, "A senha deve ter pelo menos 6 caracteres.");
    return { nome, usuario, senha };
  }
  function lerEmpresas(d, admin) {
    if (admin) return [501, 507];
    const emps = [...new Set((d.empresas || []).map(Number).filter((e) => EMPRESAS[e]))].sort();
    if (!emps.length) throw erro(400, "Selecione pelo menos um CD para o usuário.");
    return emps;
  }

  function validarLancamento(u, d) {
    const reg = {
      empresa: exigirEmpresa(u, d.empresa),
      data: dataISO(d.data, "Data do pagamento"),
      fornecedor: texto(d.fornecedor).toUpperCase(),
      nf: texto(d.nf, 40).toUpperCase(),
      carga: texto(d.carga, 40).toUpperCase(),
      tipo: d.tipo,
      quitado: d.quitado ? 1 : 0,
      obs: texto(d.obs, 300),
    };
    for (const f of FORMAS) reg[f] = centavos(d[f], f);
    if (!reg.fornecedor) throw erro(400, "Informe o fornecedor / transportador.");
    if (!reg.nf) throw erro(400, "Informe o número da NFS-e / RPS.");
    if (!TIPOS.includes(reg.tipo)) throw erro(400, "Informe o tipo da carga (agendada ou sem agenda).");
    if (somaL(reg) <= 0) throw erro(400, "Informe o valor em pelo menos uma forma de pagamento.");
    return reg;
  }

  /** Mesma NFS-e na mesma empresa em até ~180 dias (a numeração reinicia com o tempo). */
  async function checarDuplicado(reg, ignorarId, forcar) {
    if (forcar) return;
    const alvo = reg.data.slice(0, 7);
    const meses = mesesEntre(somarMeses(alvo, -6) + "-01", somarMeses(alvo, 6) + "-01");
    const listas = await Promise.all(meses.map((m) => lerMes(reg.empresa, m, m === alvo ? 0 : 5 * 60e3)));
    const lim = 180 * 864e5;
    const t = new Date(reg.data + "T12:00:00");
    for (const itens of listas) {
      for (const l of itens.values()) {
        if (l.id !== ignorarId && l.nf === reg.nf && Math.abs(new Date(l.data + "T12:00:00") - t) <= lim) {
          throw erro(409, `A NFS-e/RPS ${reg.nf} já foi lançada em ${fmtBR(l.data)} (${l.fornecedor}).`, { duplicado: true });
        }
      }
    }
  }

  /** Lançamentos da empresa no período (lê só os meses necessários). */
  async function lancamentosPeriodo(emp, de, ate) {
    let ids;
    if (de && ate) {
      const meses = mesesEntre(de, ate);
      if (meses.length <= 24) {
        await Promise.all(meses.map((m) => lerMes(emp, m, 30e3)));
        ids = meses.map((m) => docIdMes(emp, m));
      }
    }
    if (!ids) ids = await lerTodosMeses(emp);
    const out = [];
    for (const id of ids) {
      const c = cache.get(id);
      if (c) for (const l of c.itens.values()) if ((!de || l.data >= de) && (!ate || l.data <= ate)) out.push(l);
    }
    return { itens: out, ids };
  }

  function filtrar(lista, q) {
    const up = (s) => texto(s).toUpperCase();
    const forn = up(q.fornecedor), nf = up(q.nf), carga = up(q.carga), busca = up(q.q);
    return lista.filter((l) =>
      (!forn || l.fornecedor.includes(forn)) && (!nf || l.nf.includes(nf)) && (!carga || l.carga.includes(carga)) &&
      (!busca || l.fornecedor.includes(busca) || l.nf.includes(busca) || (l.carga || "").includes(busca)) &&
      (!FORMAS.includes(q.forma) || l[q.forma] > 0) &&
      (!TIPOS.includes(q.tipo) || l.tipo === q.tipo) &&
      (!["0", "1"].includes(q.quitado) || Number(l.quitado) === Number(q.quitado)));
  }
  // data mais recente primeiro; empates pela hora de criação e pelo id, para a paginação ser sempre a mesma
  const ordenarDesc = (a, b) => (a.data !== b.data ? (a.data < b.data ? 1 : -1)
    : (b.criado_em || "").localeCompare(a.criado_em || "") || String(b.id).localeCompare(String(a.id), "pt-BR", { numeric: true }));
  const lancPub = (l) => ({ ...l, quitado: !!Number(l.quitado), total: somaL(l) });

  async function buscarLanc(u, id) {
    if (!localizacao.has(id)) {
      // raro: lançamento ainda não carregado nesta sessão -> procura nos meses das empresas do usuário
      for (const emp of u.empresas) await lerTodosMeses(emp);
    }
    const docId = localizacao.get(id);
    if (!docId) throw erro(404, "Lançamento não encontrado. Atualize a página e tente de novo.");
    const [emp, mes] = docId.split("_");
    exigirEmpresa(u, emp);
    const itens = await lerMes(Number(emp), mes, 0);
    const l = itens.get(id);
    if (!l) throw erro(404, "Este lançamento foi alterado ou excluído por outro usuário. Atualize a lista.");
    return { l, docId };
  }

  /* ---------------------------------------------------------------- rotas */
  const R = [];
  const rota = (m, re, fn) => R.push([m, re, fn]);

  rota("GET", /^\/api\/status$/, async () => {
    const empresas = Object.entries(EMPRESAS).map(([k, v]) => ({ codigo: Number(k), nome: v }));
    await authPronto;
    const setup = await fs.collection("config").doc("setup").get();
    if (auth.currentUser && !perfil) await carregarPerfil();
    return { precisa_configurar: !setup.exists, usuario: perfil, empresas };
  });

  rota("POST", /^\/api\/setup$/, async (q, d) => {
    if ((await fs.collection("config").doc("setup").get()).exists) throw erro(400, "O sistema já foi configurado.");
    const { nome, usuario, senha } = validarUsuario(d);
    const cred = await auth.createUserWithEmailAndPassword(email(usuario), senha);
    const uid = cred.user.uid;
    const lote = fs.batch();
    lote.set(fs.collection("usuarios").doc(uid), { nome, usuario, admin: true, empresas: [501, 507], ativo: true, criado_em: agora() });
    lote.set(fs.collection("config").doc("setup"), { criado_em: agora(), por: uid });
    await lote.commit();
    await carregarPerfil();
    return { usuario: perfil };
  });

  rota("POST", /^\/api\/login$/, async (q, d) => {
    const usuario = texto(d.usuario, 40).toLowerCase();
    if (!usuario || !d.senha) throw erro(401, "Usuário ou senha incorretos.");
    await auth.signInWithEmailAndPassword(email(usuario), String(d.senha));
    if (!(await carregarPerfil())) throw erro(403, "Usuário desativado ou sem cadastro. Fale com o administrador.");
    return { usuario: perfil };
  });

  rota("POST", /^\/api\/logout$/, async () => {
    pararTudo();
    perfil = null;
    await auth.signOut();
    return { ok: true };
  });

  rota("POST", /^\/api\/minha-senha$/, async (q, d) => {
    const u = atual();
    if (String(d.nova || "").length < 6) throw erro(400, "A nova senha deve ter pelo menos 6 caracteres.");
    const cred = firebase.auth.EmailAuthProvider.credential(email(u.usuario), String(d.atual || ""));
    try { await auth.currentUser.reauthenticateWithCredential(cred); }
    catch (e) { const t = traduzir(e); throw t.status === 401 ? erro(400, "Senha atual incorreta.") : t; }
    await auth.currentUser.updatePassword(String(d.nova));
    return { ok: true };
  });

  rota("GET", /^\/api\/lancamentos$/, async (q) => {
    const u = atual();
    const emp = exigirEmpresa(u, q.empresa);
    const { itens, ids } = await lancamentosPeriodo(emp, q.de, q.ate);
    const lista = filtrar(itens, q).sort(ordenarDesc);
    if (ids.length <= 3) observar(ids);
    const tam = Math.min(Math.max(Number(q.tamanho) || 50, 1), 500);
    const pag = Math.max(Number(q.pagina) || 1, 1);
    const soma = { dinheiro: 0, debito: 0, credito: 0, boleto: 0 };
    lista.forEach((l) => FORMAS.forEach((f) => (soma[f] += l[f] || 0)));
    soma.total = somaL(soma);
    return { itens: lista.slice((pag - 1) * tam, pag * tam).map(lancPub), quantidade: lista.length, pagina: pag, tamanho: tam, soma };
  });

  rota("GET", /^\/api\/lancamentos\/exportar$/, async (q) => {
    const u = atual();
    const emp = exigirEmpresa(u, q.empresa);
    const { itens } = await lancamentosPeriodo(emp, q.de, q.ate);
    const lista = filtrar(itens, q).sort((a, b) => -ordenarDesc(a, b));
    const br = (c) => (c ? (c / 100).toFixed(2).replace(".", ",") : "");
    const cel = (s) => (/[;"\r\n]/.test(String(s)) ? `"${String(s).replace(/"/g, '""')}"` : s);
    let csv = "DATA;FORNECEDOR / TRANSPORTADOR;NFS-e / RPS;CARGA;EMP.;TIPO DA CARGA;DINHEIRO;DEBITO;CREDITO;BOLETO;TOTAL;QUITADO;OBSERVACAO;LANCADO POR\r\n";
    for (const l of lista) {
      csv += [fmtBR(l.data), l.fornecedor, l.nf, l.carga, emp, l.tipo === "agendada" ? "AGENDADA" : "SEM AGENDA",
        br(l.dinheiro), br(l.debito), br(l.credito), br(l.boleto), br(somaL(l)), Number(l.quitado) ? "SIM" : "NÃO", l.obs, l.criado_por].map(cel).join(";") + "\r\n";
    }
    return { arquivo: `lancamentos_${emp}_${agora().slice(0, 10).replace(/-/g, "")}.csv`, conteudo: csv, tipo: "text/csv;charset=utf-8" };
  });

  rota("GET", /^\/api\/fornecedores$/, async (q) => {
    const u = atual();
    const emp = exigirEmpresa(u, q.empresa);
    const hoje = agora().slice(0, 10);
    const meses = mesesEntre(somarMeses(hoje, -3) + "-01", hoje);
    const listas = await Promise.all(meses.map((m) => lerMes(emp, m, 10 * 60e3)));
    const cont = {};
    listas.forEach((itens) => itens.forEach((l) => (cont[l.fornecedor] = (cont[l.fornecedor] || 0) + 1)));
    return Object.entries(cont).sort((a, b) => b[1] - a[1]).slice(0, 800).map(([n]) => n).sort();
  });

  rota("POST", /^\/api\/lancamentos$/, async (q, d) => {
    const u = atual();
    const reg = validarLancamento(u, d);
    await checarDuplicado(reg, null, d.forcar);
    const id = novoId();
    const item = { ...reg, origem: "app", criado_por: u.usuario, criado_em: agora(), alterado_por: "", alterado_em: "" };
    const mes = reg.data.slice(0, 7);
    const docId = docIdMes(reg.empresa, mes);
    ignorarEventosAte = Date.now() + 2500;
    await fs.collection("meses").doc(docId).set({ empresa: reg.empresa, mes, itens: { [id]: serializar(item) } }, { merge: true });
    atualizarCache(docId, id, { ...item, id, empresa: reg.empresa });
    return lancPub({ ...item, id });
  });

  rota("PUT", /^\/api\/lancamentos\/([\w-]+)$/, async (q, d, id) => {
    const u = atual();
    const { l, docId } = await buscarLanc(u, id);
    const reg = validarLancamento(u, d);
    if (reg.empresa !== l.empresa) throw erro(400, "Não é possível mudar a empresa de um lançamento.");
    await checarDuplicado(reg, id, d.forcar);
    const item = { ...l, ...reg, alterado_por: u.usuario, alterado_em: agora() };
    const mes = reg.data.slice(0, 7);
    const novoDoc = docIdMes(reg.empresa, mes);
    ignorarEventosAte = Date.now() + 2500;
    if (novoDoc === docId) {
      await fs.collection("meses").doc(docId).set({ empresa: reg.empresa, mes, itens: { [id]: serializar(item) } }, { merge: true });
    } else {
      // mudou de mês: grava no mês novo e remove do antigo na mesma operação
      const lote = fs.batch();
      lote.set(fs.collection("meses").doc(novoDoc), { empresa: reg.empresa, mes, itens: { [id]: serializar(item) } }, { merge: true });
      lote.update(fs.collection("meses").doc(docId), new FieldPath("itens", id), FieldValue.delete(), "movidoPara", novoDoc);
      await lote.commit();
      atualizarCache(docId, id, null);
    }
    atualizarCache(novoDoc, id, item);
    return lancPub(item);
  });

  rota("POST", /^\/api\/lancamentos\/([\w-]+)\/quitado$/, async (q, d, id) => {
    const u = atual();
    const { l, docId } = await buscarLanc(u, id);
    const item = { ...l, quitado: d.quitado ? 1 : 0, alterado_por: u.usuario, alterado_em: agora() };
    ignorarEventosAte = Date.now() + 2500;
    await fs.collection("meses").doc(docId).update(new FieldPath("itens", id), serializar(item));
    atualizarCache(docId, id, item);
    return { ok: true, quitado: !!item.quitado };
  });

  rota("DELETE", /^\/api\/lancamentos\/([\w-]+)$/, async (q, d, id) => {
    const u = atual();
    exigirAdmin(u);
    const { docId } = await buscarLanc(u, id);
    ignorarEventosAte = Date.now() + 2500;
    await fs.collection("meses").doc(docId).update(new FieldPath("itens", id), FieldValue.delete());
    atualizarCache(docId, id, null);
    return { ok: true };
  });

  rota("GET", /^\/api\/fluxo$/, async (q) => {
    const u = atual();
    const emp = exigirEmpresa(u, q.empresa);
    const mes = q.mes || agora().slice(0, 7);
    if (!/^\d{4}-\d{2}$/.test(mes)) throw erro(400, "Mês inválido.");
    const itens = await lerMes(emp, mes, 0);
    observar([docIdMes(emp, mes)]);
    const porDia = {};
    for (const l of itens.values()) {
      const d = (porDia[l.data] ||= { data: l.data, agendada: { dinheiro: 0, debito: 0, credito: 0, boleto: 0 }, sem_agenda: { dinheiro: 0, debito: 0, credito: 0, boleto: 0 }, quantidade: 0 });
      FORMAS.forEach((f) => (d[l.tipo][f] += l[f] || 0));
      d.quantidade++;
    }
    return { empresa: emp, mes, dias: Object.values(porDia).sort((a, b) => (a.data < b.data ? -1 : 1)) };
  });

  /* ---- usuários */
  async function todosUsuarios() {
    const snap = await fs.collection("usuarios").get();
    return snap.docs.map((d) => pub(d.id, d.data()));
  }

  rota("GET", /^\/api\/usuarios$/, async () => {
    exigirAdmin(atual());
    return (await todosUsuarios()).sort((a, b) => b.admin - a.admin || a.nome.localeCompare(b.nome));
  });

  let appCadastro = null;
  rota("POST", /^\/api\/usuarios$/, async (q, d) => {
    exigirAdmin(atual());
    const { nome, usuario, senha } = validarUsuario(d);
    const admin = !!d.admin;
    const empresas = lerEmpresas(d, admin);
    if ((await todosUsuarios()).some((x) => x.usuario === usuario)) throw erro(400, `O usuário '${usuario}' já existe.`);
    // cria a conta numa instância separada para não desconectar o administrador
    appCadastro = appCadastro || firebase.initializeApp(CFG, "cadastro");
    const authCad = appCadastro.auth();
    await authCad.setPersistence(firebase.auth.Auth.Persistence.NONE).catch(() => {});
    let uid;
    try {
      uid = (await authCad.createUserWithEmailAndPassword(email(usuario), senha)).user.uid;
    } catch (e) {
      if (e.code === "auth/email-already-in-use") {
        throw erro(400, `O login '${usuario}' já foi usado antes. Escolha outro (ex.: ${usuario}2) ou apague a conta antiga em Firebase Console > Authentication.`);
      }
      throw e;
    } finally {
      authCad.signOut().catch(() => {});
    }
    const dados = { nome, usuario, admin, empresas, ativo: true, criado_em: agora() };
    await fs.collection("usuarios").doc(uid).set(dados);
    return pub(uid, dados);
  });

  rota("PUT", /^\/api\/usuarios\/([\w-]+)$/, async (q, d, uid) => {
    const eu = atual();
    exigirAdmin(eu);
    const lista = await todosUsuarios();
    const alvo = lista.find((x) => x.id === uid);
    if (!alvo) throw erro(404, "Usuário não encontrado.");
    const nome = texto(d.nome, 80);
    if (!nome) throw erro(400, "Informe o nome.");
    if (texto(d.usuario, 40).toLowerCase() !== alvo.usuario) throw erro(400, "O login não pode ser alterado. Crie um novo usuário se precisar de outro login.");
    if (d.senha) {
      throw erro(400, uid === eu.id
        ? "Para trocar a sua senha use o menu do seu nome > Alterar minha senha."
        : "Por segurança, só o próprio usuário troca a senha (menu do nome > Alterar minha senha). Se ele esqueceu, exclua e crie um novo login.");
    }
    const admin = !!d.admin;
    const ativo = d.ativo !== false;
    const empresas = lerEmpresas(d, admin);
    if ((!admin || !ativo) && alvo.admin && !lista.some((x) => x.admin && x.ativo && x.id !== uid)) {
      throw erro(400, "É preciso manter pelo menos um administrador ativo.");
    }
    await fs.collection("usuarios").doc(uid).update({ nome, admin, empresas, ativo });
    if (uid === eu.id) await carregarPerfil();
    return pub(uid, { ...alvo, nome, admin, empresas, ativo });
  });

  rota("DELETE", /^\/api\/usuarios\/([\w-]+)$/, async (q, d, uid) => {
    const eu = atual();
    exigirAdmin(eu);
    if (uid === eu.id) throw erro(400, "Você não pode excluir o seu próprio usuário.");
    const lista = await todosUsuarios();
    const alvo = lista.find((x) => x.id === uid);
    if (!alvo) throw erro(404, "Usuário não encontrado.");
    if (alvo.admin && !lista.some((x) => x.admin && x.ativo && x.id !== uid)) throw erro(400, "É preciso manter pelo menos um administrador ativo.");
    await fs.collection("usuarios").doc(uid).delete();
    return { ok: true };
  });

  /* ---- backup */
  rota("GET", /^\/api\/backup$/, async () => {
    exigirAdmin(atual());
    const lancamentos = [];
    for (const emp of [501, 507]) {
      for (const id of await lerTodosMeses(emp)) {
        for (const l of cache.get(id).itens.values()) lancamentos.push({ ...l, empresa: emp });
      }
    }
    lancamentos.sort((a, b) => a.empresa - b.empresa || (a.data < b.data ? -1 : a.data > b.data ? 1 : 0));
    const conteudo = JSON.stringify({ v: 2, origem: "firebase", gerado_em: agora(), usuarios: await todosUsuarios(), lancamentos });
    return { arquivo: `backup_controle_financeiro_${agora().slice(0, 16).replace(/[- :]/g, "")}.json`, conteudo, tipo: "application/json" };
  });

  /** Restaura lançamentos de um backup (desta versão, da versão arquivo único ou do histórico da planilha). */
  rota("POST", /^\/api\/backup$/, async (q, d) => {
    exigirAdmin(atual());
    const dados = d.dados || {};
    if (!Array.isArray(dados.lancamentos)) throw erro(400, "Arquivo de backup inválido.");
    const substituir = d.modo !== "adicionar";
    // agrupa por empresa/mês
    const grupos = new Map();
    const vistos = new Set();
    // identifica a instalação da versão arquivo único pelo "salt" do 1º usuário (estável e único por computador)
    const origemLocal = String((dados.usuarios || []).find((x) => x && x.salt)?.salt || "x").replace(/\W/g, "").slice(0, 8);
    let n = 0;
    for (const bruto of dados.lancamentos) {
      const emp = Number(bruto.empresa);
      if (!EMPRESAS[emp] || !/^\d{4}-\d{2}-\d{2}$/.test(bruto.data || "")) continue;
      let id = String(bruto.id ?? "").replace(/[^\w-]/g, "");
      // backups da versão arquivo único numeram 1, 2, 3… em cada computador: prefixa com a "instalação"
      // de origem para dois computadores não sobrescreverem os lançamentos um do outro
      if (/^\d+$/.test(id)) id = `L${origemLocal}_${id}`;
      if (!id || vistos.has(id)) id = novoId();
      vistos.add(id);
      const item = { origem: "backup", criado_por: "", criado_em: "", alterado_por: "", alterado_em: "", obs: "", carga: "", ...bruto };
      FORMAS.forEach((f) => (item[f] = Math.max(0, Math.round(Number(item[f]) || 0))));
      item.quitado = item.quitado ? 1 : 0;
      if (!TIPOS.includes(item.tipo)) item.tipo = "agendada";
      const docId = docIdMes(emp, item.data.slice(0, 7));
      if (!grupos.has(docId)) grupos.set(docId, { empresa: emp, mes: item.data.slice(0, 7), itens: {} });
      grupos.get(docId).itens[id] = serializar(item);
      n++;
    }
    pararTudo();
    ignorarEventosAte = Date.now() + 60e3;
    if (substituir) {
      for (const emp of [501, 507]) {
        const snap = await fs.collection("meses").where("empresa", "==", emp).get();
        for (const doc of snap.docs) if (!grupos.has(doc.id)) await doc.ref.delete();
      }
    }
    for (const [docId, g] of grupos) {
      await fs.collection("meses").doc(docId).set(g, { merge: !substituir });
    }
    ignorarEventosAte = 0;
    return {
      ok: true, lancamentos: n, sair: false,
      mensagem: `${n.toLocaleString("pt-BR")} lançamentos ${substituir ? "restaurados" : "adicionados"} em ${grupos.size} mês(es). Os usuários não são alterados pelo backup.`,
    };
  });

  /* ---------------------------------------------------------------- ponto de entrada */
  window.apiLocal = async function (metodo, url, corpo) {
    if (!configurado) {
      throw erro(503, window.firebase
        ? "O Firebase ainda não foi configurado. Preencha o arquivo firebase-config.js com os dados do seu projeto (veja o LEIA-ME)."
        : "Não foi possível carregar o Firebase. Verifique a conexão com a internet.");
    }
    const u = new URL(url, "http://local");
    const q = Object.fromEntries(u.searchParams);
    for (const [m, re, fn] of R) {
      if (m !== metodo) continue;
      const achou = u.pathname.match(re);
      if (!achou) continue;
      try {
        if (!/status|setup|login/.test(u.pathname)) await authPronto;
        return JSON.parse(JSON.stringify(await fn(q, corpo || {}, ...achou.slice(1))));
      } catch (e) {
        throw traduzir(e);
      }
    }
    throw erro(404, "Rota não encontrada.");
  };
})();

</script>
<script>
"use strict";

/* =====================================================================
   Controle Financeiro · CD 1 (501) / CD 2 (507)
   Interface: menu lateral + páginas (#/novo, #/consulta, #/fluxo, #/usuarios, #/backup).
   Os dados vêm de api(): servidor (server.py), navegador (local-api.js) ou Firebase (firebase-api.js).
   ===================================================================== */

const FORMAS = [
  { k: "dinheiro", nome: "Dinheiro", ic: "i-cash" },
  { k: "debito", nome: "Débito", ic: "i-card" },
  { k: "credito", nome: "Crédito", ic: "i-card" },
  { k: "boleto", nome: "Boleto", ic: "i-barcode" },
];
const MESES = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
const DSEM = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
const PAGINAS = {
  novo: { titulo: "Novo lançamento", ic: "i-plus", menu: "Novo lançamento" },
  consulta: { titulo: "Consultar lançamentos", ic: "i-list", menu: "Consultar" },
  fluxo: { titulo: "Fluxo de caixa", ic: "i-chart", menu: "Fluxo de caixa" },
  usuarios: { titulo: "Usuários", ic: "i-users", menu: "Usuários", admin: true },
  backup: { titulo: "Backup dos dados", ic: "i-database", menu: "Backup", admin: true },
};
const TAM_PAGINA = 100;
// Logos: no arquivo único (gerar_html.py) vêm embutidas uma vez em window.IMAGENS; no servidor, da pasta /img
const IMG = {
  azul: window.IMAGENS?.["logo-azul.png"] || "/img/logo-azul.png",
  branco: window.IMAGENS?.["logo-branco.png"] || "/img/logo-branco.png",
};

const S = {
  usuario: null,
  empresas: [],
  empresa: null,
  pagina: "novo",
  // formulário
  ultimoTipo: "agendada",
  ultimasFormas: ["debito"],
  fornecedores: [],
  // consulta
  filtro: null, // null = mês atual na primeira abertura
  pag: 1,
  // fluxo
  mes: null,
  dia: "",
  tipoTabela: "todas",
  fluxo: null,
};

/* ---------------------------------------------------------------- utilitários */

const $ = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => [...el.querySelectorAll(sel)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ic = (id, cls = "i") => `<svg class="${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;
const fmtBRL = (c) => (c / 100).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const fmtNum = (c) => (c / 100).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtData = (iso) => (iso ? iso.slice(0, 10).split("-").reverse().join("/") : "");
const fmtDataHora = (s) => (s ? `${fmtData(s)} ${s.slice(11, 16)}`.trim() : "");
const isoLocal = (d) => { const x = new Date(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0, 10); };
const hojeISO = () => isoLocal(new Date());
const diaSemana = (iso) => DSEM[new Date(iso + "T12:00:00").getDay()];
const nomeMes = (ym) => { const [a, m] = ym.split("-").map(Number); return `${MESES[m - 1]}/${a}`; };
const nomeEmpresa = (cod) => (S.empresas.find((e) => e.codigo === cod) || {}).nome || String(cod);
const rotuloEmpresa = (cod) => `${nomeEmpresa(cod)} · ${cod}`;
const iniciais = (nome) => nome.split(/\s+/).filter(Boolean).slice(0, 2).map((p) => p[0]).join("").toUpperCase();
const zeros = () => ({ dinheiro: 0, debito: 0, credito: 0, boleto: 0 });
const somaObj = (o) => o.dinheiro + o.debito + o.credito + o.boleto;
const somar = (alvo, fonte) => { for (const f of FORMAS) alvo[f.k] += fonte[f.k] || 0; return alvo; };
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const guardar = (k, v) => { try { v === null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch { /* sem storage */ } };
const lerGuardado = (k) => { try { return sessionStorage.getItem(k); } catch { return null; } };

/** "1.234,56" | "1234,5" | "1234.56" | "1.200" -> centavos (inteiro). null se inválido. */
function parseBRL(txt) {
  let s = String(txt ?? "").trim().replace(/[R$\s]/g, "");
  if (!s) return 0;
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, "");
  if (!/^\d*\.?\d*$/.test(s) || s === ".") return null;
  const n = Number(s);
  return Number.isFinite(n) ? Math.round(n * 100) : null;
}

/** Evita que uma resposta antiga sobrescreva uma mais nova (filtros digitados rápido). */
function sequenciador() {
  let n = 0;
  return () => { const meu = ++n; return () => meu === n; };
}

/* ---------------------------------------------------------------- acesso à API */

const MODO_LOCAL = typeof window.apiLocal === "function"; // API roda no navegador (arquivo único ou Firebase)
const INFO = window.API_INFO || { modo: MODO_LOCAL ? "local" : "servidor" };

async function api(metodo, url, corpo) {
  let dados;
  try {
    if (MODO_LOCAL) {
      dados = await window.apiLocal(metodo, url, corpo);
    } else {
      const opt = { method: metodo, headers: {}, credentials: "same-origin" };
      if (corpo !== undefined) { opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(corpo); }
      let r;
      try { r = await fetch(url, opt); }
      catch { throw Object.assign(new Error("Sem conexão com o servidor. Verifique a rede e tente de novo."), { status: 0 }); }
      dados = await r.json().catch(() => ({}));
      if (!r.ok) throw Object.assign(new Error(dados.erro || "Erro inesperado."), { status: r.status, dados });
    }
  } catch (e) {
    if (e.status === 401 && S.usuario && !/\/(login|minha-senha)$/.test(url)) {
      S.usuario = null;
      fecharCamadas();
      toast("Sua sessão expirou. Entre novamente.", "erro");
      renderLogin();
    }
    throw e;
  }
  return dados;
}

/* ---------------------------------------------------------------- componentes de interface */

/** Liga cada <label> de .field ao seu campo (acessibilidade e clique no rótulo). */
let seqCampo = 0;
function ligarLabels(root = document) {
  $$(".field", root).forEach((f) => {
    const lb = $(":scope > label", f);
    const inp = $("input, select, textarea", f);
    if (!lb || !inp || lb.htmlFor || $("input, select, textarea", lb)) return;
    if (!inp.id) inp.id = `cmp-${++seqCampo}`;
    lb.htmlFor = inp.id;
  });
}
let ligarAgendado = false;
new MutationObserver(() => {
  if (ligarAgendado) return;
  ligarAgendado = true;
  requestAnimationFrame(() => { ligarAgendado = false; ligarLabels(); });
}).observe(document.documentElement, { childList: true, subtree: true });

function toast(msg, tipo = "ok") {
  const el = document.createElement("div");
  el.className = "toast" + (tipo === "ok" ? "" : " " + tipo);
  el.setAttribute("role", tipo === "erro" ? "alert" : "status");
  el.innerHTML = `${ic(tipo === "erro" ? "i-alert" : tipo === "info" ? "i-info" : "i-check")}<span>${esc(msg)}</span>`;
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), tipo === "erro" ? 6500 : 3400);
}

// Camadas sobrepostas (painel lateral, modais). Esc fecha a de cima.
const camadas = [];
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && camadas.length) { e.preventDefault(); camadas[camadas.length - 1].fechar(null); }
});
function abrirCamada(html, aoFechar) {
  const el = document.createElement("div");
  el.innerHTML = html;
  const raiz = el.firstElementChild;
  $("#camada").appendChild(raiz);
  const anterior = document.activeElement;
  const item = {
    raiz,
    fechar(v) {
      const i = camadas.indexOf(item);
      if (i < 0) return;
      camadas.splice(i, 1);
      raiz.remove();
      if (anterior && anterior.isConnected) anterior.focus?.();
      aoFechar && aoFechar(v);
    },
  };
  camadas.push(item);
  $(".fundo", raiz)?.addEventListener("click", () => item.fechar(null));
  return item;
}
function fecharCamadas() { while (camadas.length) camadas[camadas.length - 1].fechar(null); }

function modal({ titulo, corpo, botoes, largura }) {
  return new Promise((resolve) => {
    const c = abrirCamada(`
      <div class="modal-wrap">
        <div class="fundo"></div>
        <div class="modal" role="dialog" aria-modal="true" aria-label="${esc(titulo)}" ${largura ? `style="max-width:${largura}px"` : ""}>
          <div class="modal-h"><h3>${esc(titulo)}</h3><button class="btn-icon" data-x aria-label="Fechar">${ic("i-x")}</button></div>
          <div class="modal-b">${corpo}</div>
          <div class="modal-f">${botoes.map((b, i) => `<button class="btn ${b.cls || "btn-outline"}" data-b="${i}">${esc(b.txt)}</button>`).join("")}</div>
        </div>
      </div>`, resolve);
    const m = $(".modal", c.raiz);
    $("[data-x]", m).onclick = () => c.fechar(null);
    $$("[data-b]", m).forEach((b) => {
      b.onclick = async () => {
        const def = botoes[+b.dataset.b];
        if (!def.acao) return c.fechar(def.valor);
        b.disabled = true;
        try {
          const r = await def.acao(m);
          if (r !== false) c.fechar(r ?? def.valor);
        } finally { b.disabled = false; }
      };
    });
    ($("input:not([type=hidden]):not([disabled]), select", m) || $(".btn-red, .btn-primary", m))?.focus();
  });
}

const confirmar = (titulo, html, txtOk = "Confirmar", perigo = false) =>
  modal({ titulo, corpo: `<p>${html}</p>`, botoes: [{ txt: "Cancelar", valor: false }, { txt: txtOk, cls: perigo ? "btn-red" : "btn-primary", valor: true }] });

function painelLateral(titulo, montar) {
  const c = abrirCamada(`
    <div class="camada-drawer">
      <div class="fundo"></div>
      <aside class="drawer" role="dialog" aria-modal="true" aria-label="${esc(titulo)}">
        <div class="drawer-h"><h3>${esc(titulo)}</h3><button class="btn-icon" data-x aria-label="Fechar">${ic("i-x")}</button></div>
        <div class="drawer-b"></div>
      </aside>
    </div>`);
  $("[data-x]", c.raiz).onclick = () => c.fechar(null);
  montar($(".drawer-b", c.raiz), () => c.fechar(null));
  return c;
}

function mostrarErro(form, msg) {
  const el = $(".erro-form", form);
  el.innerHTML = `${ic("i-alert")}<span>${esc(msg)}</span>`;
  el.classList.remove("hidden");
}

function baixarArquivo(nome, conteudo, tipo) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([conteudo], { type: tipo }));
  a.download = nome;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}

/* ---------------------------------------------------------------- início e telas de acesso */

async function iniciar() {
  try {
    const st = await api("GET", "/api/status");
    S.empresas = st.empresas;
    if (st.precisa_configurar) return renderSetup();
    if (!st.usuario) return renderLogin();
    S.usuario = st.usuario;
    posLogin();
  } catch (e) {
    telaSimples(`
      <h1>Controle Financeiro</h1>
      <p class="sub">Não foi possível iniciar o sistema.</p>
      <div class="erro-form">${ic("i-alert")}<span>${esc(e.message)}</span></div>
      <button class="btn btn-primary btn-bloco" style="margin-top:16px" onclick="location.reload()">Tentar de novo</button>`);
  }
}

function telaSimples(conteudo, largura = 440) {
  $("#app").innerHTML = `
    <div class="acesso"><div class="acesso-card" style="max-width:${largura}px">
      <img class="acesso-logo" src="${IMG.azul}" alt="Supermercados Nagumo">
      ${conteudo}
    </div></div>`;
}

function telaDividida(conteudo) {
  $("#app").innerHTML = `
    <div class="acesso"><div class="acesso-split">
      <section class="acesso-marca">
        <img src="${IMG.branco}" alt="Supermercados Nagumo">
        <h2>Controle<br>Financeiro</h2>
        <p>Registro dos pagamentos de descarga e fluxo de caixa dos centros de distribuição.</p>
        <ul>
          <li>${ic("i-receipt")}Lançamentos por NFS-e / RPS</li>
          <li>${ic("i-chart")}Fluxo de caixa por dia e por mês</li>
          <li>${ic("i-building")}CD 1 · 501 e CD 2 · 507</li>
        </ul>
      </section>
      <section class="acesso-form">${conteudo}</section>
    </div></div>`;
}

function renderSetup() {
  telaDividida(`
    <h1>Configuração inicial</h1>
    <p class="sub">Crie o usuário <b>administrador</b> do sistema.</p>
    <form autocomplete="off" novalidate>
      <div class="field"><label>Nome completo</label><input class="input" name="nome" required></div>
      <div class="field"><label>Usuário (login)</label><input class="input" name="usuario" required placeholder="ex.: admin" autocapitalize="off"></div>
      <div class="field"><label>Senha</label><input class="input" name="senha" type="password" minlength="6" required placeholder="Mínimo 6 caracteres"></div>
      <div class="field"><label>Confirmar senha</label><input class="input" name="senha2" type="password" required></div>
      <div class="erro-form hidden"></div>
      <button class="btn btn-red">Criar administrador e entrar</button>
    </form>`);
  const form = $("#app form");
  form.nome.focus();
  form.onsubmit = async (e) => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(form));
    if (d.senha !== d.senha2) return mostrarErro(form, "As senhas não conferem.");
    const btn = $("button", form);
    btn.disabled = true;
    try {
      const r = await api("POST", "/api/setup", d);
      S.usuario = r.usuario;
      posLogin();
    } catch (x) { mostrarErro(form, x.message); btn.disabled = false; }
  };
}

function renderLogin() {
  telaDividida(`
    <h1>Entrar</h1>
    <p class="sub">Use o login e a senha fornecidos pelo administrador.</p>
    <form novalidate>
      <div class="field"><label>Usuário</label><input class="input" name="usuario" autocomplete="username" autocapitalize="off" required></div>
      <div class="field"><label>Senha</label><input class="input" name="senha" type="password" autocomplete="current-password" required></div>
      <div class="erro-form hidden"></div>
      <button class="btn btn-primary">Entrar</button>
    </form>
    <div class="rodape-acesso">Esqueceu a senha? Fale com o administrador do sistema.</div>`);
  const form = $("#app form");
  form.usuario.focus();
  form.onsubmit = async (e) => {
    e.preventDefault();
    if (!form.usuario.value.trim() || !form.senha.value) return mostrarErro(form, "Informe o usuário e a senha.");
    const btn = $("button", form);
    btn.disabled = true;
    btn.textContent = "Entrando…";
    try {
      const r = await api("POST", "/api/login", Object.fromEntries(new FormData(form)));
      S.usuario = r.usuario;
      posLogin();
    } catch (x) {
      mostrarErro(form, x.message);
      btn.disabled = false;
      btn.textContent = "Entrar";
      form.senha.select();

}

function paginaDaURL() {
  const p = location.hash.replace(/^#\/?/, "");

  if (location.hash !== `#/${pagina}`) history.replaceState(null, "", `#/${pagina}`);
  return pagina;
}
